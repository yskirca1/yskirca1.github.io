<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try { var t = localStorage.getItem("tema"); if (t === "acik" || t === "koyu") document.documentElement.dataset.tema = t; } catch (e) {}</script>
  <title>Sayfa bulunamadı · Yusuf Selim Kırca</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230F5C6E'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' fill='%23FAF8F5'%3EY%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    /* Ana sayfayla aynı renkler ve yazı tipleri */
    :root { --zemin: #FAF8F5; --metin: #1C1B19; --ikincil: #5C5A55; --vurgu: #0F5C6E; --vurgu-koyu: #0A4654; --cizgi: #E7E3DC; }
    :root { color-scheme: only light; --dugme-yazi: #FFFFFF; }
    @media (prefers-color-scheme: dark) { :root:not([data-tema="acik"]) { --zemin: #161513; --metin: #ECE8E1; --ikincil: #A9A49B; --vurgu: #6FBFD1; --vurgu-koyu: #93D2E0; --cizgi: #2E2B27; --dugme-yazi: #0E1A1D; color-scheme: dark; } }
    :root[data-tema="koyu"] { --zemin: #161513; --metin: #ECE8E1; --ikincil: #A9A49B; --vurgu: #6FBFD1; --vurgu-koyu: #93D2E0; --cizgi: #2E2B27; --dugme-yazi: #0E1A1D; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--zemin); color: var(--metin); font-family: "Inter", system-ui, sans-serif; font-size: 1.0625rem; line-height: 1.7; padding: 1.25rem; }
    main { max-width: 34rem; }
    .kod { font-family: "Newsreader", Georgia, serif; font-size: 5rem; line-height: 1; color: var(--vurgu); margin: 0; }
    h1 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: clamp(1.8rem, 6vw, 2.4rem); line-height: 1.2; margin: 1rem 0 0.75rem; }
    p { margin: 0 0 0.5rem; color: var(--ikincil); }
    .en { margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid var(--cizgi); }
    a.dugme { display: inline-block; margin-top: 1.75rem; padding: 0.7rem 1.3rem; background: var(--vurgu); color: var(--dugme-yazi); text-decoration: none; border-radius: 6px; font-weight: 500; transition: background 0.2s; }
    a.dugme:hover { background: var(--vurgu-koyu); }
    a.dugme:focus-visible { outline: 2px solid var(--vurgu); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <p class="kod" aria-hidden="true">404</p>
    <h1>Aradığın sayfa burada değil.</h1>
    <p>Adres yanlış yazılmış ya da sayfa taşınmış olabilir.</p>
    <p class="en" lang="en">This page doesn't exist. The address may be mistyped, or the page may have moved.</p>
    <a class="dugme" href="/">Ana sayfaya dön · Back to home</a>
  </main>
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "6826d7dd5a68458283f2d2ac217636ae"}'></script>
</body>
</html>
