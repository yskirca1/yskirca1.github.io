<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yusuf Selim Kırca</title>
  <meta name="description" content="Yusuf Selim Kırca · KOBİ Pazarlama, Kuveyt Türk · Endüstri Mühendisliği, İTÜ. Projeler, geziler ve iletişim.">
  <meta property="og:title" content="Yusuf Selim Kırca">
  <meta property="og:description" content="Hâlâ öğreniyorum. / Still learning.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yusufselimkirca.com/">
  <meta property="og:image" content="https://yusufselimkirca.com/img/profil.webp">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230F5C6E'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' fill='%23FAF8F5'%3EY%3C/text%3E%3C/svg%3E">

  <!-- Fontlar: başlıklar Newsreader, gövde Inter (ikisi de Türkçe karakter destekli) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       1) RENKLER VE ÖLÇÜLER — tasarımı buradan değiştirebilirsin
       ============================================================ */
    :root {
      --zemin: #FAF8F5;        /* arka plan */
      --metin: #1C1B19;        /* ana metin */
      --ikincil: #5C5A55;      /* ikincil metin */
      --vurgu: #0F5C6E;        /* petrol mavisi */
      --vurgu-koyu: #0A4654;   /* vurgunun üzerine gelince */
      --cizgi: #E7E3DC;        /* çizgiler ve haritada gidilmemiş ülkeler */
      --ev: #1C1B19;           /* haritada Türkiye ("ev") */
      --serif: "Newsreader", Georgia, "Times New Roman", serif;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --dar: 44rem;            /* yazı sütunu genişliği */
      --genis: 66rem;          /* harita ve görseller için geniş sütun */
      --kenar: 1.25rem;        /* sayfa kenar boşluğu */
    }

    /* ============================================================
       2) TEMEL
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 5rem; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--zemin);
      color: var(--metin);
      font-family: var(--sans);
      font-size: 1.0625rem;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    [hidden] { display: none !important; }
    img { max-width: 100%; height: auto; display: block; }
    a { color: var(--vurgu); text-decoration-thickness: 1px; text-underline-offset: 0.2em; transition: color 0.2s; }
    a:hover { color: var(--vurgu-koyu); }
    button { font: inherit; color: inherit; cursor: pointer; }
    h1, h2, h3 { font-family: var(--serif); font-weight: 500; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
    p { margin: 0 0 1.1em; }

    /* Klavye ile gezerken görünen odak çerçevesi */
    :focus-visible { outline: 2px solid var(--vurgu); outline-offset: 3px; border-radius: 3px; }

    .gizli-etiket { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .atla { position: absolute; left: 1rem; top: -4rem; background: var(--vurgu); color: #fff; padding: 0.6rem 1rem; border-radius: 4px; z-index: 100; }
    .atla:focus { top: 1rem; color: #fff; }

    .dar { max-width: var(--dar); margin-inline: auto; padding-inline: var(--kenar); }
    .genis { max-width: var(--genis); margin-inline: auto; padding-inline: var(--kenar); }

    /* ============================================================
       3) ÜST ŞERİT
       ============================================================ */
    .ust {
      position: sticky; top: 0; z-index: 50;
      background: rgba(250, 248, 245, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--cizgi);
    }
    .ust-ic { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 3.75rem; }
    .ust-ad { font-family: var(--serif); font-size: 1.2rem; color: var(--metin); text-decoration: none; padding: 0.5rem 0; }
    .ust-sag { display: flex; align-items: center; gap: 0.5rem; }
    .menu { display: none; position: absolute; left: 0; right: 0; top: 100%; background: var(--zemin); border-bottom: 1px solid var(--cizgi); padding: 0.5rem var(--kenar) 1rem; }
    .menu.acik { display: block; }
    .menu a { display: block; padding: 0.75rem 0; color: var(--metin); text-decoration: none; font-size: 1rem; }
    .menu a:hover { color: var(--vurgu); }
    .menu a[aria-current="page"] { color: var(--vurgu); text-decoration: underline; text-underline-offset: 0.4em; }
    /* Menüden bir bölüm seçilince yalnızca o bölüm görünür */
    .tek-sayfa .bolum { border-top: 0; min-height: 70vh; }
    .menu-dugme { display: inline-flex; align-items: center; justify-content: center; width: 2.75rem; height: 2.75rem; background: none; border: 0; border-radius: 6px; }
    .menu-dugme svg { width: 1.4rem; height: 1.4rem; }
    .dil { display: inline-flex; border: 1px solid var(--cizgi); border-radius: 999px; padding: 2px; }
    .dil button { background: none; border: 0; border-radius: 999px; min-width: 2.75rem; min-height: 2.4rem; font-size: 0.85rem; font-weight: 500; color: var(--ikincil); transition: background 0.2s, color 0.2s; }
    .dil button[aria-pressed="true"] { background: var(--vurgu); color: #fff; }

    /* ============================================================
       4) GİRİŞ
       ============================================================ */
    .giris { padding-block: 3.5rem 3rem; }
    .giris img { width: 8.5rem; height: 8.5rem; border-radius: 50%; object-fit: cover; margin-bottom: 1.75rem; }
    .giris h1 { font-size: clamp(2.5rem, 9vw, 4.25rem); }
    .giris-alt { margin: 1.1rem 0 0; color: var(--ikincil); line-height: 1.6; }
    .giris-alt span { display: block; }
    .imza { margin: 1.75rem 0 0; font-family: var(--serif); font-style: italic; font-size: 1.5rem; color: var(--vurgu); }

    /* ============================================================
       5) BÖLÜMLER (ortak)
       ============================================================ */
    .bolum { padding-block: 3.5rem; border-top: 1px solid var(--cizgi); }
    .bolum-etiket { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--vurgu); margin: 0 0 0.9rem; }
    .bolum h2 { font-size: clamp(1.9rem, 6vw, 2.6rem); margin-bottom: 1.5rem; }

    /* ============================================================
       6) PROJELER
       ============================================================ */
    .proje { padding-top: 2.5rem; margin-top: 2.5rem; border-top: 1px solid var(--cizgi); }
    .proje:first-of-type { padding-top: 0; margin-top: 0; border-top: 0; }
    .proje-bas { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1rem; }
    .proje h3 { font-size: clamp(1.5rem, 5vw, 1.9rem); }
    .durum { font-size: 0.8rem; font-weight: 500; color: var(--vurgu); border: 1px solid var(--vurgu); border-radius: 999px; padding: 0.15rem 0.75rem; white-space: nowrap; }
    .proje-alt { font-family: var(--serif); font-style: italic; font-size: 1.2rem; color: var(--ikincil); margin: 0.5rem 0 1.5rem; }
    .gorseller { display: grid; gap: 1rem; margin: 0 0 1.75rem; }
    .gorseller img { width: 100%; border: 1px solid var(--cizgi); border-radius: 8px; }
    .gorsel-not { font-size: 0.9rem; font-style: italic; color: var(--ikincil); margin: 0; }
    .adimlar { margin: 0; }
    .adimlar dt { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--vurgu); margin-top: 1.4rem; }
    .adimlar dt:first-child { margin-top: 0; }
    .adimlar dd { margin: 0.3rem 0 0; }
    .dugme { display: inline-block; margin-top: 1.75rem; padding: 0.7rem 1.3rem; background: var(--vurgu); color: #fff; text-decoration: none; border-radius: 6px; font-weight: 500; transition: background 0.2s; }
    .dugme:hover { background: var(--vurgu-koyu); color: #fff; }

    /* ============================================================
       7) GEZİLER
       ============================================================ */
    .sayac { display: flex; align-items: baseline; gap: 0.6rem; margin: 0 0 1rem; }
    .sayac b { font-family: var(--serif); font-weight: 500; font-size: 4rem; line-height: 1; color: var(--vurgu); }
    .sayac span { font-size: 1.15rem; color: var(--ikincil); }
    .duraklar { margin: 0 0 1.75rem; }
    .duraklar-etiket { color: var(--ikincil); }
    .durak-liste { list-style: none; margin: 0.3rem 0 0; padding: 0; }
    .durak-liste li { position: relative; padding: 0.15rem 0; }
    .durak { display: inline-block; padding: 0.35rem 0; border-bottom: 1px dashed var(--vurgu); cursor: default; }
    .sehirler { display: none; position: absolute; left: 0; top: 100%; z-index: 5; background: var(--metin); color: var(--zemin); font-size: 0.9rem; padding: 0.35rem 0.7rem; border-radius: 5px; white-space: nowrap; }
    .durak:hover + .sehirler, .durak:focus-visible + .sehirler { display: block; }

    .harita-kutu { position: relative; border: 1px solid var(--cizgi); border-radius: 8px; background: #fff; overflow: hidden; aspect-ratio: 4 / 3; }
    .harita-kutu svg { display: block; width: 100%; height: 100%; touch-action: pan-x pan-y; }
    .harita-kutu svg.suruklenebilir { cursor: grab; }
    .harita-kutu svg.surukleniyor { cursor: grabbing; }
    /* Sınır çizgisi ekranda hep aynı incelikte kalır; yakınlaşınca da ülkeler ayırt edilir */
    .ulke { fill: var(--cizgi); stroke: #B9B2A6; stroke-width: 0.6; stroke-linejoin: round; vector-effect: non-scaling-stroke; transition: fill 0.15s; }
    .ulke.gidilen { fill: var(--vurgu); stroke: #FAF8F5; }
    .ulke.ev { fill: var(--ev); stroke: #FAF8F5; }
    .ulke[data-k]:hover { fill: #D3CCC0; }
    .ulke.gidilen[data-k]:hover { fill: var(--vurgu-koyu); }
    .ulke.ev[data-k]:hover { fill: #000; }
    .nokta { stroke: #fff; vector-effect: non-scaling-stroke; fill: var(--vurgu); }
    .nokta-alan { fill: transparent; }
    .harita-durum { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ikincil); font-size: 0.95rem; }
    .harita-dugmeler { position: absolute; right: 0.6rem; bottom: 0.6rem; display: grid; gap: 0.4rem; }
    .harita-dugmeler button { width: 2.75rem; height: 2.75rem; background: var(--zemin); border: 1px solid var(--cizgi); border-radius: 6px; font-size: 1.3rem; line-height: 1; display: grid; place-items: center; transition: background 0.2s; }
    .harita-dugmeler button:hover { background: var(--cizgi); }
    .harita-dugmeler svg { width: 1.1rem; height: 1.1rem; }
    .ipucu { position: absolute; z-index: 6; pointer-events: none; background: var(--metin); color: var(--zemin); font-size: 0.9rem; padding: 0.3rem 0.65rem; border-radius: 5px; white-space: nowrap; transform: translate(-50%, -140%); }
    .harita-alt { display: flex; flex-wrap: wrap; gap: 0.4rem 1.5rem; justify-content: space-between; font-size: 0.9rem; color: var(--ikincil); margin: 0.75rem 0 0; }
    .gosterge { display: flex; gap: 1.1rem; list-style: none; margin: 0; padding: 0; }
    .gosterge i { display: inline-block; width: 0.8rem; height: 0.8rem; border-radius: 2px; margin-right: 0.4rem; vertical-align: -0.05rem; }
    .ulke-listesi { margin-top: 0.75rem; font-size: 0.95rem; color: var(--ikincil); }
    .ulke-listesi summary { cursor: pointer; padding: 0.5rem 0; color: var(--vurgu); width: fit-content; }
    .ulke-listesi ul { margin: 0.25rem 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 0.2rem 0.5rem; }
    .ulke-listesi li:not(:last-child)::after { content: " ·"; }

    .serit { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin: 2.5rem 0 0; padding: 0; list-style: none; }
    .serit li { aspect-ratio: 4 / 5; background: var(--cizgi); border-radius: 6px; overflow: hidden; }
    .serit img, .panel-izgara img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease-out; }
    .serit button, .panel-izgara button { display: block; width: 100%; height: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
    .serit button:hover img, .panel-izgara button:hover img { transform: scale(1.04); }

    /* Haritada fotoğrafı olan ülkeler tıklanabilir */
    #harita .fotolu { cursor: pointer; }

    /* Ülke fotoğrafları paneli (haritada bir ülkeye tıklayınca açılır) */
    .ulke-panel { width: min(56rem, calc(100vw - 1.5rem)); max-height: calc(100dvh - 1.5rem); padding: 0; border: 0; border-radius: 10px; background: var(--zemin); color: var(--metin); box-shadow: 0 20px 60px rgba(28, 27, 25, 0.25); }
    .ulke-panel::backdrop { background: rgba(28, 27, 25, 0.55); }
    .ulke-panel[open] { display: flex; flex-direction: column; }
    body:has(.ulke-panel[open]) { overflow: hidden; }
    .panel-bas { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; padding: 1.25rem 1.25rem 0.25rem; }
    .panel-bas h2 { font-size: clamp(1.6rem, 5vw, 2.2rem); }
    .panel-bas p { margin: 0.3rem 0 0; color: var(--ikincil); font-size: 0.95rem; }
    .panel-kapat { flex: none; width: 2.75rem; height: 2.75rem; border: 1px solid var(--cizgi); border-radius: 50%; background: none; display: grid; place-items: center; transition: background 0.2s; }
    .panel-kapat:hover { background: var(--cizgi); }
    .panel-kapat svg { width: 1.2rem; height: 1.2rem; }
    .sehir-secici { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0; padding: 0.75rem 1.25rem 0; list-style: none; }
    .sehir-secici button { min-height: 2.5rem; padding: 0 1rem; border: 1px solid var(--cizgi); border-radius: 999px; background: none; font-size: 0.9rem; transition: background 0.2s, color 0.2s; }
    .sehir-secici button:hover { border-color: var(--vurgu); }
    .sehir-secici button[aria-pressed="true"] { background: var(--vurgu); border-color: var(--vurgu); color: #fff; }
    .panel-izgara { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(2, 1fr); align-content: start; gap: 0.5rem; margin: 0; padding: 1rem 1.25rem 1.25rem; list-style: none; overflow-y: auto; }
    .panel-izgara button { aspect-ratio: 4 / 5; height: auto; border-radius: 6px; overflow: hidden; background: var(--cizgi); }
    .ulke-listesi button { background: none; border: 0; padding: 0.15rem 0; color: var(--vurgu); text-decoration: underline; text-underline-offset: 0.2em; font-size: inherit; }

    /* Fotoğraf büyütme kutusu (fotoğrafa tıklayınca açılır) */
    .buyutec { width: 100vw; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; color: var(--zemin); }
    .buyutec::backdrop { background: rgba(20, 19, 17, 0.94); }
    .buyutec[open] { display: grid; grid-template-rows: auto 1fr auto; }
    body:has(.buyutec[open]) { overflow: hidden; }
    .buyutec-ust { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; font-size: 0.9rem; color: #CFCBC4; }
    .buyutec-sahne { position: relative; display: grid; place-items: center; min-height: 0; padding: 0 1rem; touch-action: pan-y; }
    .buyutec-sahne img { max-width: 100%; max-height: calc(100dvh - 9.5rem); width: auto; height: auto; object-fit: contain; border-radius: 4px; }
    .buyutec-alt { text-align: center; padding: 0.75rem 1rem 1.25rem; min-height: 3.25rem; margin: 0; font-family: var(--serif); font-style: italic; font-size: 1.1rem; }
    .buyutec button { width: 2.75rem; height: 2.75rem; border-radius: 50%; border: 1px solid rgba(250, 248, 245, 0.3); background: rgba(250, 248, 245, 0.08); color: var(--zemin); display: grid; place-items: center; transition: background 0.2s; }
    .buyutec button:hover { background: rgba(250, 248, 245, 0.2); }
    .buyutec button svg { width: 1.2rem; height: 1.2rem; }
    .buyutec :focus-visible { outline-color: var(--zemin); }
    .buyutec .onceki, .buyutec .sonraki { position: absolute; top: 50%; transform: translateY(-50%); }
    .buyutec .onceki { left: 0.75rem; }
    .buyutec .sonraki { right: 0.75rem; }
    .daha { margin: 1rem 0 0; }

    /* ============================================================
       8) İLETİŞİM VE ALT BİLGİ
       ============================================================ */
    .iletisim-satir { font-size: 1.15rem; margin: 0; }
    .iletisim-satir .ayrac { color: var(--ikincil); margin-inline: 0.6rem; }
    .yakinda { color: var(--ikincil); }
    #linkedin, #eposta { white-space: nowrap; }
    .alt { border-top: 1px solid var(--cizgi); padding-block: 2rem 3rem; color: var(--ikincil); font-size: 0.9rem; }

    /* ============================================================
       9) GENİŞ EKRAN (tablet ve masaüstü)
       ============================================================ */
    @media (min-width: 48rem) {
      :root { --kenar: 2rem; }
      .menu-dugme { display: none; }
      .menu { display: flex; position: static; gap: 1.75rem; padding: 0; border: 0; background: none; margin-right: 0.75rem; }
      .menu a { padding: 0.5rem 0; font-size: 0.95rem; }
      .giris { padding-block: 6rem 5rem; display: grid; grid-template-columns: auto 1fr; gap: 3rem; align-items: center; }
      .giris img { width: 12rem; height: 12rem; margin: 0; }
      .bolum { padding-block: 5.5rem; }
      .gorseller.iki { grid-template-columns: 1fr 1fr; }
      .adimlar { display: grid; grid-template-columns: 8.5rem 1fr; gap: 1.4rem 1.5rem; }
      .adimlar dt { margin-top: 0.35rem; }
      .adimlar dd { margin: 0; }
      .durak-liste { display: inline; }
      .durak-liste li { display: inline-block; }
      .durak-liste li:not(:last-child)::after { content: "—"; color: var(--ikincil); margin-inline: 0.6rem; }
      .harita-kutu { aspect-ratio: 1000 / 455; }
      .serit { grid-template-columns: repeat(6, 1fr); gap: 0.75rem; }
      .panel-izgara { grid-template-columns: repeat(3, 1fr); gap: 0.75rem; padding: 1.25rem 1.75rem 1.75rem; }
      .panel-bas { padding: 1.75rem 1.75rem 0.25rem; }
      .sehir-secici { padding: 0.75rem 1.75rem 0; }
    }

    /* Hareket azaltma tercihi */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }
  </style>
</head>
<body>

<a class="atla" href="#icerik" data-m="atla"></a>

<!-- ================= ÜST ŞERİT ================= -->
<header class="ust">
  <div class="genis ust-ic">
    <a class="ust-ad" href="#ust">Yusuf Selim Kırca</a>
    <div class="ust-sag">
      <nav class="menu" id="menu" aria-label="Bölümler">
        <a href="#hakkimda" data-m="menuHakkimda"></a>
        <a href="#projeler" data-m="menuProjeler"></a>
        <a href="#geziler" data-m="menuGeziler"></a>
        <a href="#iletisim" data-m="menuIletisim"></a>
      </nav>
      <div class="dil" role="group" aria-label="Dil / Language">
        <button type="button" data-dil="tr" aria-pressed="true" aria-label="Türkçe">TR</button>
        <button type="button" data-dil="en" aria-pressed="false" aria-label="English">EN</button>
      </div>
      <button type="button" class="menu-dugme" id="menuDugme" aria-expanded="false" aria-controls="menu">
        <span class="gizli-etiket" data-m="menuDugme"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="icerik">

  <!-- ================= GİRİŞ ================= -->
  <section class="genis giris" id="ust">
    <img src="img/profil.webp" width="640" height="640" alt="Yusuf Selim Kırca" fetchpriority="high">
    <div>
      <h1>Yusuf Selim Kırca</h1>
      <p class="giris-alt">
        <span data-m="girisSatir1"></span>
        <span data-m="girisSatir2"></span>
      </p>
      <p class="imza" data-m="imza"></p>
    </div>
  </section>

  <!-- ================= HAKKIMDA ================= -->
  <section class="bolum" id="hakkimda">
    <div class="dar">
      <p class="bolum-etiket" data-m="menuHakkimda"></p>
      <h2 data-m="hakkimdaBaslik"></h2>
      <p data-m="hakkimda1"></p>
      <p data-m="hakkimda2"></p>
      <p data-m="hakkimda3"></p>
    </div>
  </section>

  <!-- ================= PROJELER ================= -->
  <section class="bolum" id="projeler">
    <div class="dar">
      <h2 data-m="menuProjeler"></h2>

      <!-- Proje 1: ReviewRadar -->
      <article class="proje">
        <div class="proje-bas">
          <h3>ReviewRadar</h3>
          <span class="durum" data-m="rrDurum"></span>
        </div>
        <p class="proje-alt" data-m="rrAlt"></p>
        <div class="gorseller">
          <img src="img/reviewradar.webp" width="1440" height="900" loading="lazy" data-m-alt="rrGorselAlt" alt="">
        </div>

try { dil = localStorage.getItem("dil") === "en" ? "en" : "tr"; } catch (e) {}

function m(anahtar) { return METINLER[dil][anahtar]; }

function metinleriYaz() {
  document.documentElement.lang = dil;
  // data-m="anahtar" taşıyan her öğenin içine o dildeki metin yazılır
  document.querySelectorAll("[data-m]").forEach(el => { el.innerHTML = m(el.dataset.m); });

   E) GEZİLER — sayaç, son duraklar, ülke listesi, fotoğraf şeridi
   ================================================================== */
document.getElementById("sayac").textContent = ULKELER.filter(k => k !== EV).length;

// Gidilen ülkelerin adı yukarıdaki listeden, diğerlerininki tarayıcının kendi ülke adları sözlüğünden gelir
let ulkeSozlugu = {};
function ulkeAdi(kod) {
  if (ULKE_ADLARI[kod]) return ULKE_ADLARI[kod][dil];
  try {
    if (!ulkeSozlugu[dil]) ulkeSozlugu[dil] = new Intl.DisplayNames([dil], { type: "region" });
    return ulkeSozlugu[dil].of(kod);
  } catch (e) { return kod; }
}

// ["2026-01","2026-07"] -> "Ocak & Temmuz 2026"
function tarihYaz(tarihler) {
  const ayAdi = t => {
    const ad = new Intl.DateTimeFormat(dil, { month: "long" }).format(new Date(t + "-15"));
    return ad.charAt(0).toLocaleUpperCase(dil) + ad.slice(1);
  };
  const yillar = tarihler.map(t => t.slice(0, 4));
  if (yillar.every(y => y === yillar[0])) return tarihler.map(ayAdi).join(" & ") + " " + yillar[0];
  return tarihler.map(t => ayAdi(t) + " " + t.slice(0, 4)).join(" & ");
}

function duraklariYaz() {
  const liste = document.getElementById("durakListe");
  liste.innerHTML = "";
  SON_DURAKLAR.forEach(d => {
    const li = document.createElement("li");
    const yazi = ulkeAdi(d.ulke) + " · " + tarihYaz(d.tarihler);
    if (d.sehirler) {
      // Şehirler: üzerine gelince görünür (tıklama gerekmez); klavyede Tab, telefonda dokunma da aynı işi görür
      const dugme = document.createElement("span");
      dugme.className = "durak"; dugme.textContent = yazi;
      dugme.tabIndex = 0;   // klavyeyle ve telefonda dokununca da odaklanabilsin
      const sehir = document.createElement("span");
      sehir.className = "sehirler"; sehir.textContent = d.sehirler[dil];
      li.append(dugme, sehir);
    } else {
      li.textContent = yazi;
    }
    liste.append(li);
  });
}

function ulkeListesiniYaz() {
  const liste = document.getElementById("ulkeListesi");
  liste.innerHTML = "";
  ULKELER.map(k => ({ k, ad: ulkeAdi(k) + (k === EV ? " (" + m("ev").toLocaleLowerCase(dil) + ")" : "") }))
    .sort((a, b) => a.ad.localeCompare(b.ad, dil))
    .forEach(u => {
      const li = document.createElement("li");
      if (ulkeFotolari(u.k).length) {
        // Fotoğrafı olan ülke: klavyeyle de açılabilsin diye düğme
        const dugme = document.createElement("button");
        dugme.type = "button"; dugme.textContent = u.ad;
        dugme.addEventListener("click", () => ulkePaneliAc(u.k));
        li.append(dugme);
      } else {
        li.textContent = u.ad;
      }
      liste.append(li);
    });
}

// Küçük fotoğraf düğmesi: tıklayınca "liste" içindeki "sira"ncı fotoğraf büyük açılır
function kucukFoto(f, liste, sira) {
  const li = document.createElement("li");
  const dugme = document.createElement("button");
  dugme.type = "button";
  dugme.setAttribute("aria-label", m("fotoBuyut") + (f[dil] ? ": " + f[dil] : ""));
  dugme.addEventListener("click", () => buyutecAc(liste, sira, dugme));
  const img = document.createElement("img");
  img.src = f.dosya; img.alt = ""; img.loading = "lazy"; img.width = 800; img.height = 1000;
  dugme.append(img); li.append(dugme);
  return li;
}

function vitrinFotolari() {
  const v = FOTOGRAFLAR.filter(f => f.vitrin);
  return (v.length ? v : FOTOGRAFLAR).slice(0, 6);
}

function seridiYaz() {
  const serit = document.getElementById("serit");
  serit.innerHTML = "";
  const liste = vitrinFotolari();
  if (liste.length === 0) {
    for (let i = 0; i < 6; i++) serit.append(document.createElement("li"));   // gri yer tutucular
    return;
  }
  serit.removeAttribute("aria-hidden");
  liste.forEach((f, sira) => serit.append(kucukFoto(f, liste, sira)));
}

/* ------------------------------------------------------------------
   Ülke fotoğrafları paneli
   Haritada (ya da ülke listesinde) fotoğrafı olan bir ülkeye tıklayınca açılır.
   Ülkenin birden fazla şehri varsa üstte şehir düğmeleri çıkar.
   ------------------------------------------------------------------ */
const ulkePanel = document.getElementById("ulkePanel");
let panelUlke = null, panelSehir = null;

function sehirAdi(s) { return typeof s === "string" ? s : (s ? s[dil] : ""); }
function ulkeFotolari(kod) { return FOTOGRAFLAR.filter(f => f.ulke === kod); }

function paneliYaz() {
  const hepsi = ulkeFotolari(panelUlke);
  const sehirler = [...new Set(hepsi.map(f => sehirAdi(f.sehir)).filter(Boolean))];
  // Şehri yazılmamış fotoğraflar, başka şehirler de varsa "Diğer" düğmesinde toplanır ("" = diğer)
  if (sehirler.length && hepsi.some(f => !sehirAdi(f.sehir))) sehirler.push("");
  const uyar = (f, sehir) => sehirAdi(f.sehir) === sehir || (sehir === "" && !sehirAdi(f.sehir));
  const liste = panelSehir === null ? hepsi : hepsi.filter(f => uyar(f, panelSehir));
  document.getElementById("panelBaslik").textContent = ulkeAdi(panelUlke);
  document.getElementById("panelAlt").textContent = hepsi.length + " " + m("fotoAdet") + (sehirler.length === 1 && sehirler[0] ? " · " + sehirler[0] : "");

  // Şehir düğmeleri (tek şehir varsa gösterilmez)
  const secici = document.getElementById("sehirSecici");
  secici.innerHTML = "";
  secici.setAttribute("aria-label", m("sehirSec"));
  secici.hidden = sehirler.length < 2;
  [null, ...sehirler].forEach(sehir => {
    const li = document.createElement("li");
    const dugme = document.createElement("button");
    dugme.type = "button";
    const adet = sehir === null ? hepsi.length : hepsi.filter(f => uyar(f, sehir)).length;
    dugme.textContent = (sehir === null ? m("tumu") : sehir || m("diger")) + " (" + adet + ")";
    dugme.setAttribute("aria-pressed", panelSehir === sehir);
    dugme.addEventListener("click", () => {
      panelSehir = sehir;
      paneliYaz();
      // Düğmeler yeniden çizildi; odak yeni seçili düğmede kalsın
      secici.querySelector('[aria-pressed="true"]').focus();
    });
    li.append(dugme); secici.append(li);
  });

  const izgara = document.getElementById("panelIzgara");
  izgara.innerHTML = "";
  liste.forEach((f, sira) => izgara.append(kucukFoto(f, liste, sira)));
}

function ulkePaneliAc(kod) {
  if (!ulkeFotolari(kod).length) return;
  panelUlke = kod; panelSehir = null;
  paneliYaz();
  ulkePanel.showModal();
  document.getElementById("panelIzgara").scrollTop = 0;
}

document.getElementById("panelKapat").addEventListener("click", () => ulkePanel.close());
ulkePanel.addEventListener("click", e => { if (e.target === ulkePanel) ulkePanel.close(); });   // panelin dışına tıklama

/* ------------------------------------------------------------------
   Fotoğraf büyütme kutusu
   Açma: fotoğrafa tıkla. Geçiş: oklar, klavyede sol/sağ ok, telefonda kaydır.
   Kapatma: × düğmesi, Esc ya da fotoğrafın dışına tıklama.
   ------------------------------------------------------------------ */
const buyutec = document.getElementById("buyutec");
const buyutecResim = document.getElementById("buyutecResim");
let fotoSira = 0;
let aktifListe = [];      // şu an gezilen fotoğraflar (şerit ya da seçili ülke/şehir)
let donusOdak = null;     // kutu kapanınca odağın döneceği küçük fotoğraf

function fotoGoster(sira) {
  const adet = aktifListe.length;
  fotoSira = (sira + adet) % adet;   // sondan başa, baştan sona döner
  const f = aktifListe[fotoSira];
  buyutecResim.src = f.dosya;
  buyutecResim.alt = f[dil] || "";
  document.getElementById("buyutecAlt").textContent = f[dil] || "";
  document.getElementById("buyutecSayac").textContent = (fotoSira + 1) + " / " + adet;
  document.getElementById("buyutecOnceki").hidden = adet < 2;
  document.getElementById("buyutecSonraki").hidden = adet < 2;
  // Bir sonraki ve önceki fotoğrafı önceden yükle ki geçiş beklemesin
  [1, -1].forEach(k => { new Image().src = aktifListe[(fotoSira + k + adet) % adet].dosya; });
}

function buyutecAc(liste, sira, kucuk) {
  aktifListe = liste;
  donusOdak = kucuk || null;
  fotoGoster(sira);
  buyutec.showModal();
}

buyutec.addEventListener("close", () => {
  // Kapanınca odak, fotoğrafın açıldığı küçük resme döner
  if (donusOdak && donusOdak.isConnected) donusOdak.focus();
});
document.getElementById("buyutecKapat").addEventListener("click", () => buyutec.close());
document.getElementById("buyutecOnceki").addEventListener("click", () => fotoGoster(fotoSira - 1));
document.getElementById("buyutecSonraki").addEventListener("click", () => fotoGoster(fotoSira + 1));
buyutec.addEventListener("click", e => {
  if (e.target === buyutec || e.target.id === "buyutecSahne") buyutec.close();   // fotoğrafın dışı
});
buyutec.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") fotoGoster(fotoSira - 1);
  if (e.key === "ArrowRight") fotoGoster(fotoSira + 1);
});
let kaydirmaBasi = null;
buyutec.addEventListener("touchstart", e => { kaydirmaBasi = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
buyutec.addEventListener("touchend", e => {
  if (kaydirmaBasi === null) return;
  const fark = e.changedTouches[0].clientX - kaydirmaBasi;
  if (Math.abs(fark) > 50) fotoGoster(fotoSira + (fark < 0 ? 1 : -1));
  kaydirmaBasi = null;
});

/* ==================================================================
   G) HARİTA
   Veri: data/world-50m.json (orta detay) ve data/world-10m.json (yüksek
   detay). İkisi de Natural Earth'ten üretildi; her ülkenin çizimi hazır
   bir SVG yolu olarak durur (k: ülke kodu, d: yol, c: merkez, a: alan).
   ================================================================== */
const svg = document.getElementById("harita");
const kutu = document.getElementById("haritaKutu");
const ipucu = document.getElementById("ipucu");
const SVGNS = "http://www.w3.org/2000/svg";
const HARITA_G = 1000, HARITA_Y = 455;   // haritanın kendi ölçüsü
const EN_YAKIN = 16;                     // en fazla kaç kat yakınlaşılır
const BASLANGIC_MERKEZ = 625;            // dar ekranda ilk görünümün ortası (Avrupa–Afrika–Asya)

let gorunum = { x: 0, y: 0, g: HARITA_G };   // şu an görünen alan (sol, üst, genişlik)
let ilkGenislik = HARITA_G;
let yollar = {};            // ülke anahtarı -> <path>
let noktalar = [];          // küçük ülke noktaları
let yuklendi = false, detayIstendi = false;

function kutuOrani() { return kutu.clientHeight / kutu.clientWidth; }

// Görünümü sınırlar içinde tutar ve SVG'ye uygular
function gorunumuUygula() {
  if (!kutu.clientWidth || !kutu.clientHeight) return;
  gorunum.g = Math.min(Math.max(gorunum.g, HARITA_G / EN_YAKIN), HARITA_G);
  const yuk = gorunum.g * kutuOrani();
  gorunum.x = Math.min(Math.max(gorunum.x, 0), HARITA_G - gorunum.g);
  gorunum.y = yuk >= HARITA_Y ? (HARITA_Y - yuk) / 2 : Math.min(Math.max(gorunum.y, 0), HARITA_Y - yuk);
  svg.setAttribute("viewBox", gorunum.x + " " + gorunum.y + " " + gorunum.g + " " + yuk);
  // Noktalar ekranda hep aynı boyda kalsın
  const birim = gorunum.g / kutu.clientWidth;   // 1 ekran pikseli kaç harita birimi
  noktalar.forEach(n => {
    n.gorunen.setAttribute("r", 4.5 * birim);
    n.gorunen.setAttribute("stroke-width", 1.5);
    n.alan.setAttribute("r", 14 * birim);
  });
  svg.classList.toggle("suruklenebilir", gorunum.g < ilkGenislik - 1);
  // Yakınlaşınca yüksek detayı arka planda yükle
  if (yuklendi && !detayIstendi && gorunum.g < ilkGenislik / 1.5) { detayIstendi = true; veriYukle("data/world-10m.json"); }
}

function ilkGorunum() {
  // Dar (dikey) kutuda harita yüksekliği dolduracak kadar yakından başlar
  ilkGenislik = Math.min(HARITA_G, HARITA_Y / kutuOrani());
  const yuk = ilkGenislik * kutuOrani();
  gorunum = { g: ilkGenislik, x: ilkGenislik < HARITA_G ? BASLANGIC_MERKEZ - ilkGenislik / 2 : 0, y: (HARITA_Y - yuk) / 2 };
  gorunumuUygula();
}

// Ekrandaki bir noktayı harita koordinatına çevirir
function haritaNoktasi(ekranX, ekranY) {
  const r = svg.getBoundingClientRect();
  return { x: gorunum.x + (ekranX - r.left) / r.width * gorunum.g, y: gorunum.y + (ekranY - r.top) / r.width * gorunum.g };
}

// kat > 1 yakınlaştırır. (ekranX, ekranY) noktası yerinde kalır.
function yakinlastir(kat, ekranX, ekranY) {
  const r = svg.getBoundingClientRect();
  if (ekranX === undefined) { ekranX = r.left + r.width / 2; ekranY = r.top + r.height / 2; }
  const p = haritaNoktasi(ekranX, ekranY);
  const yeniG = Math.min(Math.max(gorunum.g / kat, HARITA_G / EN_YAKIN), HARITA_G);
  gorunum.x = p.x - (ekranX - r.left) / r.width * yeniG;
  gorunum.y = p.y - (ekranY - r.top) / r.width * yeniG;
  gorunum.g = yeniG;
  gorunumuUygula();
}

function durumSinifi(kod) { return kod === EV ? " ev" : ULKELER.includes(kod) ? " gidilen" : ""; }

// Veriyi indirir; ülkeleri çizer ya da (yüksek detayda) çizimleri yeniler
function veriYukle(dosya) {
  return fetch(dosya).then(c => { if (!c.ok) throw new Error(dosya); return c.json(); }).then(veri => {
    veri.ulkeler.forEach(u => {
      const anahtar = u.k || u.ad;
      let yol = yollar[anahtar];
      if (!yol) {
        yol = document.createElementNS(SVGNS, "path");
        yol.setAttribute("class", "ulke" + durumSinifi(u.k));
        if (u.k) yol.dataset.k = u.k;   // ülke kodu olan her ülkenin üzerine gelince adı görünür
        // gidilen ülkeler üstte dursun diye sona, diğerleri başa eklenir
        if (ULKELER.includes(u.k)) svg.append(yol); else svg.prepend(yol);
        yollar[anahtar] = yol;
        // Küçük ülkeler için nokta: biri görünen, biri dokunmayı kolaylaştıran geniş alan
        if (ULKELER.includes(u.k) && u.a < NOKTA_ESIGI) {
          const alan = document.createElementNS(SVGNS, "circle");
          const gorunen = document.createElementNS(SVGNS, "circle");
          [alan, gorunen].forEach(c => { c.setAttribute("cx", u.c[0]); c.setAttribute("cy", u.c[1]); c.dataset.k = u.k; c.dataset.nokta = "1"; });
          alan.setAttribute("class", "nokta-alan"); gorunen.setAttribute("class", "nokta");
          if (u.k === EV) gorunen.style.fill = "var(--ev)";
          noktalar.push({ alan, gorunen });
        }
      }
      yol.setAttribute("d", u.d);
    });
    noktalar.forEach(n => svg.append(n.alan, n.gorunen));   // noktalar en üstte
    svg.querySelectorAll("[data-k]").forEach(el => el.classList.toggle("fotolu", ulkeFotolari(el.dataset.k).length > 0));
    yuklendi = true;
    document.getElementById("haritaDurum").hidden = true;
    gorunumuUygula();
  });
}

// Harita, bölüme yaklaşılınca yüklenir (sayfa açılışını yavaşlatmasın diye)
new IntersectionObserver((girisler, gozcu) => {
  if (!girisler[0].isIntersecting) return;
  gozcu.disconnect();
  veriYukle("data/world-50m.json").catch(() => { document.getElementById("haritaDurum").textContent = m("haritaHata"); });
}, { rootMargin: "600px" }).observe(kutu);

// Kutunun boyutu değişince (ekran döndürme, pencere küçültme) görünümü yeniden ayarla
let ilkGorunumHazir = false;
new ResizeObserver(() => {
  if (!kutu.clientWidth || !kutu.clientHeight) return;
  if (!ilkGorunumHazir) { ilkGorunumHazir = true; ilkGorunum(); return; }
  ilkGenislik = Math.min(HARITA_G, HARITA_Y / kutuOrani());
  gorunumuUygula();
}).observe(kutu);

// --- Düğmeler ---
document.getElementById("yakinlas").addEventListener("click", () => yakinlastir(1.6));
document.getElementById("uzaklas").addEventListener("click", () => yakinlastir(1 / 1.6));
document.getElementById("sifirla").addEventListener("click", ilkGorunum);

// --- Masaüstü: Ctrl + tekerlek yakınlaştırır; normal tekerlek sayfayı kaydırır ---
svg.addEventListener("wheel", e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  yakinlastir(e.deltaY < 0 ? 1.25 : 1 / 1.25, e.clientX, e.clientY);
}, { passive: false });

// --- Masaüstü: yakınlaşmışken fareyle sürükleyerek kaydırma ---
let surukle = null;
svg.addEventListener("pointerdown", e => {
  if (e.pointerType !== "mouse" || e.button !== 0) return;
  surukle = { x: e.clientX, y: e.clientY, basladi: false };
});
window.addEventListener("pointermove", e => {
  if (!surukle) return;
  const dx = e.clientX - surukle.x, dy = e.clientY - surukle.y;
  if (!surukle.basladi && Math.hypot(dx, dy) < 4) return;   // küçük titremeleri sürükleme sayma
  surukle.basladi = true;
  svg.classList.add("surukleniyor");
  const birim = gorunum.g / svg.getBoundingClientRect().width;
  gorunum.x -= dx * birim; gorunum.y -= dy * birim;
  surukle.x = e.clientX; surukle.y = e.clientY;
  gorunumuUygula();
});
let sonSurukleme = 0;     // sürüklemenin sonundaki tıklama ülke paneli açmasın
window.addEventListener("pointerup", () => {
  if (surukle && surukle.basladi) sonSurukleme = Date.now();
  surukle = null; svg.classList.remove("surukleniyor");
});

// --- Mobil: iki parmakla yakınlaştırma ve kaydırma (tek parmak sayfayı kaydırır) ---
let cimdik = null;
function parmaklar(e) {
  const a = e.touches[0], b = e.touches[1];
  return { mesafe: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
}
svg.addEventListener("touchstart", e => { if (e.touches.length === 2) cimdik = parmaklar(e); }, { passive: true });
svg.addEventListener("touchmove", e => {
  if (e.touches.length !== 2 || !cimdik) return;
  e.preventDefault();
  const simdi = parmaklar(e);
  const birim = gorunum.g / svg.getBoundingClientRect().width;
  gorunum.x -= (simdi.x - cimdik.x) * birim; gorunum.y -= (simdi.y - cimdik.y) * birim;
  yakinlastir(simdi.mesafe / cimdik.mesafe, simdi.x, simdi.y);
  cimdik = simdi;
}, { passive: false });
svg.addEventListener("touchend", e => { if (e.touches.length < 2) cimdik = null; });

// --- Ülke adı: üzerine gelince ya da dokununca ---
let ipucuZamani;
function ipucuGoster(e) {
  const hedef = e.target.closest("[data-k]");
  if (!hedef || (surukle && surukle.basladi)) { ipucu.hidden = true; return; }
  const r = kutu.getBoundingClientRect();
  const adet = ulkeFotolari(hedef.dataset.k).length;
  ipucu.textContent = ulkeAdi(hedef.dataset.k) + (adet ? " · " + m("fotolarinaBak") : "");
  ipucu.hidden = false;
  const yarim = ipucu.offsetWidth / 2 + 4;
  ipucu.style.left = Math.min(Math.max(e.clientX - r.left, yarim), r.width - yarim) + "px";
  ipucu.style.top = Math.max(e.clientY - r.top, 44) + "px";
}
svg.addEventListener("pointermove", e => { if (e.pointerType === "mouse") ipucuGoster(e); });
svg.addEventListener("pointerleave", () => { ipucu.hidden = true; });
svg.addEventListener("click", e => {
  if (Date.now() - sonSurukleme < 300) return;
  const hedef = e.target.closest("[data-k]");
  if (hedef && ulkeFotolari(hedef.dataset.k).length) { ipucu.hidden = true; ulkePaneliAc(hedef.dataset.k); return; }
  ipucuGoster(e);
  clearTimeout(ipucuZamani);
  ipucuZamani = setTimeout(() => { ipucu.hidden = true; }, 2500);
});

/* ==================================================================
   H) SAYFALAR
   Ana sayfada tüm bölümler alt alta durur. Üst menüden bir bölüm
   seçilince (adres #projeler gibi olur) yalnızca o bölüm gösterilir.
   Üstteki ada tıklamak ana sayfaya döndürür; tarayıcının geri tuşu da çalışır.
   ================================================================== */
const SAYFALAR = ["hakkimda", "projeler", "geziler", "iletisim"];

function sayfayiGoster() {
  const secili = location.hash.slice(1);
  const sayfa = SAYFALAR.includes(secili) ? secili : "";   // boşsa ana sayfa
  document.querySelectorAll("main > section").forEach(b => { b.hidden = sayfa !== "" && b.id !== sayfa; });
  document.body.classList.toggle("tek-sayfa", sayfa !== "");
  document.querySelectorAll(".menu a").forEach(a => {
    if (a.getAttribute("href") === "#" + sayfa) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  window.scrollTo({ top: 0, behavior: "instant" });
}
window.addEventListener("hashchange", sayfayiGoster);

/* ==================================================================
   I) BAŞLAT
   ================================================================== */
metinleriYaz();
sayfayiGoster();
</script>
