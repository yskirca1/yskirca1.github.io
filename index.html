  <style>
    /* ============================================================
       1) RENKLER VE ÖLÇÜLER — tasarımı buradan değiştirebilirsin
       ============================================================ */
    :root {
      --zemin: #FAF8F5;        /* arka plan */
      --metin: #1C1B19;        /* ana metin */
      --ikincil: #5C5A55;      /* ikincil metin */
      --vurgu: #0F5C6E;        /* petrol mavisi */
      --vurgu-koyu: #0A4654;   /* vurgunun üzerine gelince */
      --cizgi: #E7E3DC;        /* çizgiler ve haritada gidilmemiş ülkeler */
      --ev: #1C1B19;           /* haritada Türkiye ("ev") */
      --zemin-2: #F3F0EA;      /* "Şu sıralar" kutusu */
      --kutu: #FFFFFF;         /* harita kutusu */
      --ust-zemin: rgba(250, 248, 245, 0.94);   /* üst şerit */
      --vurgu-uzeri: #FFFFFF;  /* vurgu renginin üstündeki yazı */
      --ulke-sinir: #B9B2A6;   /* haritada ülke sınırları */
      --ulke-ustunde: #D3CCC0; /* haritada üzerine gelinen ülke */
      --ev-ustunde: #000000;
      --acik: #FAF8F5;         /* koyu zeminli fotoğraf kutusunda yazı (temadan bağımsız) */
      --serif: "Newsreader", Georgia, "Times New Roman", serif;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --dar: 44rem;            /* yazı sütunu genişliği */
      --genis: 66rem;          /* harita ve görseller için geniş sütun */
      --kenar: 1.25rem;        /* sayfa kenar boşluğu */
    }

    /* Koyu tema
       - Ziyaretçi seçim yapmadıysa cihazın ayarına uyar (koyu moddaysa koyu açılır).
       - Üst şeritteki tema düğmesiyle seçilirse <html data-tema="koyu"> ya da "acik" olur ve hatırlanır. */
    /* "only light": telefon karanlık moddayken tarayıcının (Chrome, Samsung İnternet) açık temayı
       kendi kendine karartmasını engeller; yoksa krem zemin kahverengiye döner. */
    :root { color-scheme: only light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-tema="acik"]) {
        --zemin: #161513;
        --metin: #ECE8E1;
        --ikincil: #A9A49B;
        --vurgu: #6FBFD1;
        --vurgu-koyu: #93D2E0;
        --cizgi: #2E2B27;
        --ev: #ECE8E1;
        --zemin-2: #1F1D1A;
        --kutu: #1B1A17;
        --ust-zemin: rgba(22, 21, 19, 0.92);
        --vurgu-uzeri: #0E1A1D;
        --ulke-sinir: #4A463F;
        --ulke-ustunde: #3A3631;
        --ev-ustunde: #FFFFFF;
        color-scheme: dark;
      }
      :root:not([data-tema="acik"]) .ulke-panel { background: var(--zemin-2); border: 1px solid var(--cizgi); }
      :root:not([data-tema="acik"]) .ulke-panel::backdrop { background: rgba(0, 0, 0, 0.7); }
    }
    :root[data-tema="koyu"] {
        --zemin: #161513;
        --metin: #ECE8E1;
        --ikincil: #A9A49B;
        --vurgu: #6FBFD1;
        --vurgu-koyu: #93D2E0;
        --cizgi: #2E2B27;
        --ev: #ECE8E1;
        --zemin-2: #1F1D1A;
        --kutu: #1B1A17;
        --ust-zemin: rgba(22, 21, 19, 0.92);
        --vurgu-uzeri: #0E1A1D;
        --ulke-sinir: #4A463F;
        --ulke-ustunde: #3A3631;
        --ev-ustunde: #FFFFFF;
        color-scheme: dark;
    }
    :root[data-tema="koyu"] .ulke-panel { background: var(--zemin-2); border: 1px solid var(--cizgi); }
    :root[data-tema="koyu"] .ulke-panel::backdrop { background: rgba(0, 0, 0, 0.7); }

    /* ============================================================
       2) TEMEL
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 5rem; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--zemin);
      color: var(--metin);
      font-family: var(--sans);
      font-size: 1.0625rem;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    [hidden] { display: none !important; }
    img { max-width: 100%; height: auto; display: block; }
    a { color: var(--vurgu); text-decoration-thickness: 1px; text-underline-offset: 0.2em; transition: color 0.2s; }
    a:hover { color: var(--vurgu-koyu); }
    button { font: inherit; color: inherit; cursor: pointer; }
    h1, h2, h3 { font-family: var(--serif); font-weight: 500; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
    p { margin: 0 0 1.1em; }

    /* Klavye ile gezerken görünen odak çerçevesi */
    :focus-visible { outline: 2px solid var(--vurgu); outline-offset: 3px; border-radius: 3px; }

    .gizli-etiket { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .atla { position: absolute; left: 1rem; top: -4rem; background: var(--vurgu); color: var(--vurgu-uzeri); padding: 0.6rem 1rem; border-radius: 4px; z-index: 100; }
    .atla:focus { top: 1rem; color: var(--vurgu-uzeri); }

    .dar { max-width: var(--dar); margin-inline: auto; padding-inline: var(--kenar); }
    .genis { max-width: var(--genis); margin-inline: auto; padding-inline: var(--kenar); }

    /* ============================================================
       3) ÜST ŞERİT
       ============================================================ */
    .ust {
      position: sticky; top: 0; z-index: 50;
      background: var(--ust-zemin);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--cizgi);
    }
    .ust-ic { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 3.75rem; }
    .ust-ad { font-family: var(--serif); font-size: 1.2rem; color: var(--metin); text-decoration: none; padding: 0.5rem 0; }
    .ust-sag { display: flex; align-items: center; gap: 0.5rem; }
    .menu { display: none; position: absolute; left: 0; right: 0; top: 100%; background: var(--zemin); border-bottom: 1px solid var(--cizgi); padding: 0.5rem var(--kenar) 1rem; }
    .menu.acik { display: block; }
    .menu a { display: block; padding: 0.75rem 0; color: var(--metin); text-decoration: none; font-size: 1rem; }
    .menu a:hover { color: var(--vurgu); }
    .menu a[aria-current="page"] { color: var(--vurgu); text-decoration: underline; text-underline-offset: 0.4em; }
    /* Menüden bir bölüm seçilince yalnızca o bölüm görünür */
    .tek-sayfa .bolum { border-top: 0; min-height: 70vh; }
    .menu-dugme { display: inline-flex; align-items: center; justify-content: center; width: 2.75rem; height: 2.75rem; background: none; border: 0; border-radius: 6px; }
    .menu-dugme svg { width: 1.4rem; height: 1.4rem; }
    /* Dar telefonlarda üst şerit tek satıra sığsın */
    @media (max-width: 400px) {
      .ust-ad { font-size: 1.05rem; white-space: nowrap; }
      .ust-sag { gap: 0.3rem; }
      .dil button { min-width: 2.4rem; }
    }
    /* Tema değişiminde mürekkep geçişi (View Transitions): eski görüntü altta, yeni tema mürekkep maskesiyle üstte */
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
    html.tema-degisiyor, html.tema-degisiyor * { transition: none !important; }
    ::view-transition-new(root) { -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
    .tema-dugme { display: inline-flex; align-items: center; justify-content: center; width: 2.75rem; height: 2.75rem; padding: 0; background: none; border: 1px solid var(--cizgi); border-radius: 50%; color: var(--metin); transition: background 0.2s; }
    .tema-dugme:hover { background: var(--zemin-2); }
    .tema-dugme svg { width: 1.15rem; height: 1.15rem; }
    .tema-dugme .gunes { display: none; }
    .tema-dugme.koyuda .ay { display: none; }
    .tema-dugme.koyuda .gunes { display: block; }
    .dil { display: inline-flex; border: 1px solid var(--cizgi); border-radius: 999px; padding: 2px; }
    .dil button { background: none; border: 0; border-radius: 999px; min-width: 2.75rem; min-height: 2.4rem; font-size: 0.85rem; font-weight: 500; color: var(--ikincil); transition: background 0.2s, color 0.2s; }
    .dil button[aria-pressed="true"] { background: var(--vurgu); color: var(--vurgu-uzeri); }

    /* ============================================================
       4) GİRİŞ
       ============================================================ */
    .giris { padding-block: 3.5rem 3rem; }
    .giris img { width: 8.5rem; height: 8.5rem; border-radius: 50%; object-fit: cover; margin-bottom: 1.75rem; }
    .giris h1 { font-size: clamp(2.5rem, 9vw, 4.25rem); }
    .giris-alt { margin: 1.1rem 0 0; color: var(--ikincil); line-height: 1.6; }
    .giris-alt span { display: block; }
    .giris-ozet { margin: 0.9rem 0 0; font-family: var(--serif); font-size: clamp(1.25rem, 3.6vw, 1.5rem); line-height: 1.4; color: var(--metin); max-width: 30rem; }
    .giris-baglantilar { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; margin: 1.5rem 0 0; }
    .giris-baglantilar a { display: inline-flex; align-items: center; gap: 0.5rem; min-height: 2.75rem; color: var(--metin); text-decoration: none; font-size: 0.95rem; }
    .giris-baglantilar a:hover, .eposta-tetik:hover { color: var(--vurgu); }
    .giris-baglantilar .eposta-tetik { display: inline-flex; align-items: center; gap: 0.5rem; min-height: 2.75rem; padding: 0; background: none; border: 0; color: var(--metin); font-size: 0.95rem; }
    .iletisim-satir .eposta-tetik { padding: 0; background: none; border: 0; font-size: inherit; color: var(--vurgu); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.2em; }

    /* E-posta menüsü */
    .eposta-menu { position: absolute; z-index: 60; min-width: 16rem; max-width: calc(100vw - 1.5rem); padding: 0.9rem 1rem; background: var(--zemin); color: var(--metin); border: 1px solid var(--cizgi); border-radius: 8px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); }
    .eposta-adres { margin: 0 0 0.75rem; font-weight: 500; word-break: break-all; }
    .eposta-dugmeler { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .eposta-dugmeler button, .eposta-dugmeler a { flex: 1 1 auto; display: inline-flex; justify-content: center; align-items: center; min-height: 2.5rem; padding: 0 0.9rem; border-radius: 6px; font-size: 0.9rem; font-weight: 500; text-decoration: none; transition: background 0.2s; }
    .eposta-dugmeler button { background: none; border: 1px solid var(--cizgi); color: var(--metin); }
    .eposta-dugmeler button:hover { background: var(--zemin-2); }
    .eposta-dugmeler a { background: var(--vurgu); color: var(--vurgu-uzeri); border: 1px solid var(--vurgu); }
    .eposta-dugmeler a:hover { background: var(--vurgu-koyu); color: var(--vurgu-uzeri); }
    .giris-baglantilar svg { width: 1.15rem; height: 1.15rem; }
    .imza { margin: 1.75rem 0 0; font-family: var(--serif); font-style: italic; font-size: 1.5rem; color: var(--vurgu); }

    /* ============================================================
       5) BÖLÜMLER (ortak)
       ============================================================ */
    .bolum { padding-block: 3.5rem; border-top: 1px solid var(--cizgi); }
    .bolum-etiket { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--vurgu); margin: 0 0 0.9rem; }
    .bolum h2 { font-size: clamp(1.9rem, 6vw, 2.6rem); margin-bottom: 1.5rem; }

    /* ============================================================
       6) PROJELER
       ============================================================ */
    .proje { padding-top: 2.5rem; margin-top: 2.5rem; border-top: 1px solid var(--cizgi); }
    .proje:first-of-type { padding-top: 0; margin-top: 0; border-top: 0; }
    .proje-bas { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1rem; }
    .proje h3 { font-size: clamp(1.5rem, 5vw, 1.9rem); }
    .durum { font-size: 0.8rem; font-weight: 500; color: var(--vurgu); border: 1px solid var(--vurgu); border-radius: 999px; padding: 0.15rem 0.75rem; white-space: nowrap; }
    .proje-yil { font-size: 0.85rem; color: var(--ikincil); font-variant-numeric: tabular-nums; }
    .proje-alt { font-family: var(--serif); font-style: italic; font-size: 1.2rem; color: var(--ikincil); margin: 0.5rem 0 1.5rem; }
    .gorseller { display: grid; gap: 1rem; margin: 0 0 1.75rem; }
    .gorseller img, .gorseller video { width: 100%; height: auto; display: block; border: 1px solid var(--cizgi); border-radius: 8px; background: #1a1d24; }
    .gorsel-not { font-size: 0.9rem; font-style: italic; color: var(--ikincil); margin: 0; }
    .gorseller figure { margin: 0; }
    .gorseller figcaption { margin-top: 0.5rem; font-size: 0.85rem; line-height: 1.5; }
    .adimlar { margin: 0; }
    .adimlar dt { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--vurgu); margin-top: 1.4rem; }
    .adimlar dt:first-child { margin-top: 0; }
    .adimlar dd { margin: 0.3rem 0 0; }
    .dugme { display: inline-block; margin-top: 1.75rem; padding: 0.7rem 1.3rem; background: var(--vurgu); color: var(--vurgu-uzeri); text-decoration: none; border-radius: 6px; font-weight: 500; transition: background 0.2s; }
    .paylasim-link { display: inline-flex; align-items: center; gap: 0.45rem; margin-top: 1.25rem; font-weight: 500; }
    .proje .dugme { margin-right: 1.25rem; }
    .paylasim-link svg { width: 1rem; height: 1rem; flex: none; }
    .su-siralar li a { white-space: nowrap; font-size: 0.9em; }
    .dugme:hover { background: var(--vurgu-koyu); color: var(--vurgu-uzeri); }

    /* ============================================================
       7) GEZİLER
       ============================================================ */
    .sayac { display: flex; align-items: baseline; gap: 0.6rem; margin: 0 0 1rem; }
    .sayac b { font-family: var(--serif); font-weight: 500; font-size: 4rem; line-height: 1; color: var(--vurgu); }
    .sayac span { font-size: 1.15rem; color: var(--ikincil); }
    .duraklar { margin: 0 0 1.75rem; }
    .cv-dugme { display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 1.25rem; }
    .cv-dugme svg { width: 1.05rem; height: 1.05rem; }
    /* Zaman çizelgesi: tek tarih ekseni, dönemler eksenin üzerinde bitişik renkli çizgiler.
       2018–2023 (lise) sıkıştırılmış gösterilir. Logolar çizgilerin başlangıcının üstünde, LinkedIn'e bağlanır.
       --a / --b: başlangıç ve bitiş yüzdesi, --k: çizginin geçmişte kalan kısmı (sonrası soluk), --kat: kaçıncı kat. */
    .zc { margin-top: 2.75rem; }
    .zc-baslik { font-family: var(--sans); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--vurgu); margin-bottom: 1rem; }
    .zc-grafik { --kalin: 0.55rem; --adim: calc(var(--kalin) + 2px); --logo: 1.9rem; --eksen: 1.6rem;
      position: relative; height: calc(var(--eksen) + 3 * var(--adim) + var(--logo) + 1.6rem); margin: 0 0.5rem; }
    .zc-eksen { position: absolute; left: 0; right: 0; bottom: var(--eksen); height: 2px; background: var(--cizgi); }
    .zc-yil { position: absolute; bottom: 0; left: var(--a); width: 2.5rem; margin-left: -1.25rem; text-align: center; font-size: 0.75rem; color: var(--ikincil); font-variant-numeric: tabular-nums; }
    .zc-yil::after { content: ""; position: absolute; left: 50%; top: -0.5rem; width: 1px; height: 0.35rem; background: var(--ikincil); }
    .zc-yil.ilk { margin-left: 0; width: auto; text-align: left; white-space: nowrap; } .zc-yil.ilk::after { display: none; }
    .zc-cizgi { position: absolute; z-index: 2; left: var(--a); width: max(var(--kalin), calc(var(--b) - var(--a))); height: var(--kalin);
      bottom: calc(var(--eksen) + 1px - var(--kalin) / 2 + var(--kat) * var(--adim)); border-radius: 999px;
      background: linear-gradient(to right, var(--renk) var(--k), color-mix(in srgb, var(--renk) 30%, transparent) var(--k)); }
    .zc-logo { position: absolute; z-index: 3; left: var(--a); bottom: calc(var(--eksen) + 3 * var(--adim) + 0.6rem); display: block; line-height: 0; border-radius: 50%; }
    .zc-logo::after { content: ""; position: absolute; left: calc(var(--kalin) / 2 - 0.5px); top: 100%; width: 1px;
      height: calc(0.6rem + (3 - var(--kat)) * var(--adim) - var(--kalin) / 2); background: var(--renk); }
    .zc-logo .kurum-logo { width: var(--logo); height: var(--logo); margin: 0; transition: transform 0.15s; }
    .zc-logo:hover .kurum-logo, .zc-logo:focus-visible .kurum-logo { transform: scale(1.12); }
    /* "Bugün" yalnızca çizgilerin hizasında; logoların arasına girmez (bitmiş işler sürüyormuş gibi görünmesin) */

    :root[data-tema="koyu"] .renk-aihl { --renk: #4CC3DC; } :root[data-tema="koyu"] .renk-itu { --renk: #8EA8FF; } :root[data-tema="koyu"] .renk-kt { --renk: #74CF5B; } :root[data-tema="koyu"] .renk-tt { --renk: #FF6B7D; }
    /* Kurum logoları: arka plansız, olduğu gibi */

    :root[data-tema="koyu"] .kurum-logo.tek-renk { filter: brightness(0) invert(1); opacity: 0.9; }
    /* Özgeçmiş listesi: yalnızca başlıklar, her biri LinkedIn'deki ilgili bölüme gider */
    .oz-grup { margin-top: 2rem; }
    .oz-grup > h3 { font-family: var(--sans); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--vurgu); margin-bottom: 0.6rem; }
    .oz-liste { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .oz-liste a:not(.oz-kart) { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0.85rem 0.35rem 0.4rem; border: 1px solid var(--cizgi); border-radius: 999px; color: var(--metin); text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: border-color 0.2s, background 0.2s; }
    .oz-liste a.logosuz { padding-left: 0.85rem; }
    .oz-liste li.kartli { flex-basis: 100%; margin-bottom: 0.25rem; }
    .oz-kart { display: grid; grid-template-columns: 1fr; border: 1px solid var(--cizgi); border-radius: 10px; overflow: hidden; color: var(--metin); text-decoration: none; background: var(--kutu); transition: border-color 0.2s; }
    .oz-kart:hover { border-color: var(--vurgu); color: var(--metin); }

    .oz-liste a:not(.oz-kart):hover { border-color: var(--vurgu); background: var(--zemin-2); color: var(--metin); }
    .oz-liste a:not(.oz-kart)::after { content: "↗"; color: var(--ikincil); font-size: 0.85em; }
    .su-siralar { margin-top: 2.25rem; padding: 1.25rem 1.5rem; border-left: 3px solid var(--vurgu); background: var(--zemin-2); border-radius: 0 6px 6px 0; }

    .harita-kutu { position: relative; border: 1px solid var(--cizgi); border-radius: 8px; background: var(--kutu); overflow: hidden; aspect-ratio: 4 / 3; }
    .harita-kutu svg { display: block; width: 100%; height: 100%; touch-action: pan-x pan-y; }

    /* Sınır çizgisi ekranda hep aynı incelikte kalır; yakınlaşınca da ülkeler ayırt edilir */

    .ulke[data-k]:hover { fill: var(--ulke-ustunde); }
    .ulke.gidilen[data-k]:hover { fill: var(--vurgu-koyu); }
    .ulke.ev[data-k]:hover { fill: var(--ev-ustunde); }
    .nokta { stroke: var(--kutu); vector-effect: non-scaling-stroke; fill: var(--vurgu); }

    .ipucu { position: absolute; z-index: 6; pointer-events: none; background: var(--metin); color: var(--zemin); font-size: 0.9rem; padding: 0.3rem 0.65rem; border-radius: 5px; white-space: nowrap; transform: translate(-50%, -140%); }
    .harita-alt { display: flex; flex-wrap: wrap; gap: 0.4rem 1.5rem; justify-content: space-between; font-size: 0.9rem; color: var(--ikincil); margin: 0.75rem 0 0; }
    .gosterge { display: flex; gap: 1.1rem; list-style: none; margin: 0; padding: 0; }
    .gosterge i { display: inline-block; width: 0.8rem; height: 0.8rem; border-radius: 2px; margin-right: 0.4rem; vertical-align: -0.05rem; }
    .ulke-listesi { margin-top: 0.75rem; font-size: 0.95rem; color: var(--ikincil); }
    .ulke-listesi summary { cursor: pointer; padding: 0.5rem 0; color: var(--vurgu); width: fit-content; }
    .ulke-listesi ul { margin: 0.25rem 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 0.2rem 0.5rem; }
    .ulke-listesi li:not(:last-child)::after { content: " ·"; }

    .serit { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin: 2.5rem 0 0; padding: 0; list-style: none; }
    .serit li { aspect-ratio: 4 / 5; background: var(--cizgi); border-radius: 6px; overflow: hidden; }
    .serit img, .panel-izgara img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease-out; }
    .serit button, .panel-izgara button { display: block; width: 100%; height: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
    .serit button:hover img, .panel-izgara button:hover img { transform: scale(1.04); }

    /* Haritada fotoğrafı olan ülkeler tıklanabilir */
    #harita .fotolu { cursor: pointer; }

    /* Ülke fotoğrafları paneli (haritada bir ülkeye tıklayınca açılır) */
    .ulke-panel { width: min(56rem, calc(100vw - 1.5rem)); max-height: calc(100dvh - 1.5rem); padding: 0; border: 0; border-radius: 10px; background: var(--zemin); color: var(--metin); box-shadow: 0 20px 60px rgba(28, 27, 25, 0.25); }

    .panel-izgara { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(2, 1fr); align-content: start; gap: 0.5rem; margin: 0; padding: 1rem 1.25rem 1.25rem; list-style: none; overflow-y: auto; }
    .panel-izgara button { aspect-ratio: 4 / 5; height: auto; border-radius: 6px; overflow: hidden; background: var(--cizgi); }
    .ulke-listesi button { background: none; border: 0; padding: 0.15rem 0; color: var(--vurgu); text-decoration: underline; text-underline-offset: 0.2em; font-size: inherit; }

    .buyutec-alt { text-align: center; padding: 0.75rem 1rem 1.25rem; min-height: 3.25rem; margin: 0; font-family: var(--serif); font-style: italic; font-size: 1.1rem; }
    .buyutec button { width: 2.75rem; height: 2.75rem; border-radius: 50%; border: 1px solid rgba(250, 248, 245, 0.3); background: rgba(250, 248, 245, 0.08); color: var(--acik); display: grid; place-items: center; transition: background 0.2s; }

    .buyutec .onceki, .buyutec .sonraki { position: absolute; top: 50%; transform: translateY(-50%); }
    .buyutec .onceki { left: 0.75rem; }
    .buyutec .sonraki { right: 0.75rem; }
    .daha { margin: 1rem 0 0; }

    /* ============================================================
       8) İLETİŞİM VE ALT BİLGİ
       ============================================================ */

  document.getElementById("haritaBaslik").textContent = m("haritaBaslik");
  duraklariYaz();
  suSiralariYaz();
  paylasimlariYaz();
  ozgecmisiYaz();
  ulkeListesiniYaz();
  seridiYaz();
  if (ulkePanel.open) paneliYaz();
  document.getElementById("buyutec").setAttribute("aria-label", m("fotoKutusu"));
  iletisimiYaz();

    const daha = document.getElementById("daha");
    daha.innerHTML = '<a target="_blank" rel="noopener"></a>';
    daha.firstChild.href = VSCO_ADRESI; daha.firstChild.textContent = m("dahaFazla"); daha.hidden = false;
  }
}

document.querySelectorAll(".dil button").forEach(b => b.addEventListener("click", () => {

  metinleriYaz();
}));

/* ==================================================================
   C2) TEMA — açık/koyu düğmesi. Seçim yapılmadıysa cihazın ayarına uyar.
   ================================================================== */
const koyuSistem = window.matchMedia("(prefers-color-scheme: dark)");
function koyuMu() {
  const t = document.documentElement.dataset.tema;
  return t ? t === "koyu" : koyuSistem.matches;
}
function temaDugmesiniYaz() {
  const koyu = koyuMu();
  const d = document.getElementById("temaDugme");
  d.classList.toggle("koyuda", koyu);
  document.getElementById("temaEtiket").textContent = m(koyu ? "acikTemayaGec" : "koyuTemayaGec");
  d.title = m(koyu ? "acikTemayaGec" : "koyuTemayaGec");
  // Telefonda tarayıcı çubuğunun rengi
  document.querySelectorAll('meta[name="theme-color"]').forEach(x => x.setAttribute("content", koyu ? "#161513" : "#FAF8F5"));
  renkSemasi();
}
function temayiUygula(yeni) {
  document.documentElement.dataset.tema = yeni;
  try { localStorage.setItem("tema", yeni); } catch (e) {}
  temaDugmesiniYaz();
}

/* Mürekkep geçişi: yeni tema, sayfanın birkaç yerine düşen mürekkep damlalarıyla yayılır.
   - İlk ve en büyük damla düğmenin olduğu yerden başlar, sonunda bütün ekranı kaplar.
   - Diğer damlalar rastgele yerlerde, farklı boyut ve gecikmeyle açılır; etraflarında küçük sıçramalar olur.
   - Damlaların kenarı dalgalanarak büyür (mürekkebin kâğıtta yayılması gibi).
   Her kare küçük bir tuvalde çizilip maske olarak kullanılır. Desteklemeyen tarayıcılarda
   ve "hareketi azalt" açıksa tema anında değişir. */
function murekkepKareleri(ox, oy) {
  const W = window.innerWidth, H = window.innerHeight;
  const O = 0.33;                                   // maske çözünürlüğü (ekranın dörtte biri; kenarlar zaten yumuşak)
  const cw = Math.max(2, Math.round(W * O)), ch = Math.max(2, Math.round(H * O));
  const rastgele = (a, b) => a + Math.random() * (b - a);
  const kosegen = Math.hypot(W, H);
  const enUzak = (x, y) => Math.max(Math.hypot(x, y), Math.hypot(W - x, y), Math.hypot(x, H - y), Math.hypot(W - x, H - y));
  // Damlalar: x, y, en büyük yarıçap, başlama ve bitiş zamanı (0–1), dalga evresi
  const damlalar = [{ x: ox, y: oy, R: enUzak(ox, oy) / 0.84, b: 0, s: 0.86, f: rastgele(0, 6), ana: true }];
  const adet = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < adet; i++) {
    damlalar.push({ x: rastgele(0.1, 0.9) * W, y: rastgele(0.15, 0.9) * H, R: kosegen * rastgele(0.12, 0.3), b: rastgele(0, 0.25), s: rastgele(0.55, 0.85), f: rastgele(0, 6) });
  }
  // Küçük sıçrama damlaları (ana damlaların çevresinde)
  const kucukler = [];
  damlalar.forEach(d => {
    const n = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      const aci = rastgele(0, Math.PI * 2), uzak = rastgele(40, 160);
      kucukler.push({ x: d.x + Math.cos(aci) * uzak, y: d.y + Math.sin(aci) * uzak, R: rastgele(6, 22), b: d.b + rastgele(0.02, 0.12), s: d.b + rastgele(0.25, 0.45), f: rastgele(0, 6) });
    }
  });
  const yumusak = t => 1 - Math.pow(1 - t, 3);   // küçük damlalar: hızlı düşer, yavaşlayarak yayılır
  const ana = t => t * t * (3 - 2 * t) * (0.25 + 0.75 * t);   // ana damla: yavaş başlar, sonda ekranı kaplar
  // Ana damla sürenin %86'sında ekranı (dalganın en içe girdiği yerler dahil) tamamen kaplar; son kareler
  // sabit dolu kalır. Böylece bitişte köşelerde son anda kapanan boşluk ve kıpırdayan kenar olmaz.
  const tuval = document.createElement("canvas");
  tuval.width = cw; tuval.height = ch;
  const c = tuval.getContext("2d");
  const kareler = [], N = 36;
  const TAM_DOLU = "none";   // son kare: maske yok, yeni tema tamamen görünür
  for (let k = 0; k <= N; k++) {
    const t = k / N;
    c.clearRect(0, 0, cw, ch);
    c.fillStyle = "#000";
    c.filter = "blur(1px)";   // mürekkep kenarı hafif yumuşak
    if (k === N) { kareler.push(TAM_DOLU); break; }   // son kare: resim değil düz dolgu (hiç boşluk kalmasın)
    {
      [...damlalar, ...kucukler].forEach(d => {
        const u = Math.min(1, Math.max(0, (t - d.b) / (d.s - d.b)));
        if (u <= 0) return;
        const r = d.R * (d.ana ? ana(u) : yumusak(u));
        const g = d.ana ? 1 - u * u : 1;   // ana damlanın dalgası sona doğru söner, kenar sakinleşir
        // Dalgalı kenar: iki farklı dalga, zamanla kayar
        c.beginPath();
        for (let a = 0; a <= 64; a++) {
          const th = (a / 64) * Math.PI * 2;
          const dalga = 1 + g * 0.07 * Math.sin(5 * th + d.f + t * 9) + g * 0.04 * Math.sin(9 * th - d.f * 1.7 - t * 13) + g * 0.025 * Math.sin(17 * th + d.f * 2.3);
          const px = (d.x + Math.cos(th) * r * dalga) * O, py = (d.y + Math.sin(th) * r * dalga) * O;
          a ? c.lineTo(px, py) : c.moveTo(px, py);
        }
        c.closePath(); c.fill();
      });
    }
    kareler.push(tuval.toDataURL("image/png"));
  }
  return kareler;
}

// Maske resimlerini animasyondan önce çöz; çözülmemiş bir kare bir anlığına boş görünüp titremeye yol açıyordu
function kareleriHazirla(kareler) {
  return Promise.all(kareler.map(k => {
    if (!k.startsWith("data:")) return Promise.resolve();
    const im = new Image(); im.src = k;
    return im.decode ? im.decode().catch(() => {}) : Promise.resolve();
  })).then(() => kareler.map(k => k.startsWith("data:") ? "url(" + k + ")" : k));
}

let gecisSuruyor = false;
const WEBKIT = /AppleWebKit/.test(navigator.userAgent) && !/Chrome|Chromium|Edg\//.test(navigator.userAgent);
document.getElementById("temaDugme").addEventListener("click", async e => {
  if (gecisSuruyor) return;   // geçiş bitmeden ikinci tıklama yeni bir geçiş başlatmasın
  const yeni = koyuMu() ? "acik" : "koyu";
  const hareketAzalt = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!document.startViewTransition || hareketAzalt) { temayiUygula(yeni); return; }
  gecisSuruyor = true;
  try {
    const r = e.currentTarget.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    // Safari (iPhone, iPad, Mac; iOS'taki bütün tarayıcılar da WebKit kullanır) maske karelerini canlandıramıyor:
    // orada yeni tema düğmeden açılan bir daireyle gelir. Diğer tarayıcılarda mürekkep efekti.
    if (WEBKIT) {
      document.documentElement.classList.add("tema-degisiyor");
      const gecis = document.startViewTransition(() => temayiUygula(yeni));
      await gecis.ready;
      const R = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      document.documentElement.animate(
        { clipPath: ["circle(0px at " + x + "px " + y + "px)", "circle(" + R + "px at " + x + "px " + y + "px)"] },
        { duration: 650, easing: "cubic-bezier(0.4, 0, 0.2, 1)", fill: "both", pseudoElement: "::view-transition-new(root)" }
      );
      await gecis.finished;
      return;
    }
    const kareler = await kareleriHazirla(murekkepKareleri(x, y));
    // Geçiş boyunca öğelerin kendi renk geçişlerini (0,2 sn) kapat; renkler tek seferde yeni temaya geçsin
    document.documentElement.classList.add("tema-degisiyor");
    const gecis = document.startViewTransition(() => temayiUygula(yeni));
    await gecis.ready;
    document.documentElement.animate(
      kareler.map(k => ({ maskImage: k, webkitMaskImage: k })),
      { duration: 1100, easing: "linear", fill: "both", pseudoElement: "::view-transition-new(root)" }
    );
    await gecis.finished;
  } catch (hata) {
    if (document.documentElement.dataset.tema !== yeni) temayiUygula(yeni);
  } finally {
    document.documentElement.classList.remove("tema-degisiyor");
    gecisSuruyor = false;
  }
});

// ["2026-01","2026-07"] -> "Ocak & Temmuz 2026"
function tarihYaz(tarihler) {
  const ayAdi = t => {
    const ad = new Intl.DateTimeFormat(dil, { month: "long" }).format(new Date(t + "-15"));
    return ad.charAt(0).toLocaleUpperCase(dil) + ad.slice(1);
  };
  const yillar = tarihler.map(t => t.slice(0, 4));
  if (yillar.every(y => y === yillar[0])) return tarihler.map(ayAdi).join(" & ") + " " + yillar[0];
  return tarihler.map(t => ayAdi(t) + " " + t.slice(0, 4)).join(" & ");
}

const CV_DOSYALARI = { tr: "cv/Yusuf_Selim_Kirca_CV_TR.pdf", en: "cv/Yusuf_Selim_Kirca_CV_EN.pdf" };
function zamanCizelgesiniYaz() {
  const Z = ZAMAN_CIZELGESI, g = document.getElementById("zamanCizelgesi");
  g.innerHTML = "";
  g.setAttribute("aria-label", m("zcAciklama"));
  const ay = t => { const [y, a] = t.split("-").map(Number); return y * 12 + (a - 1); };
  const simdi = new Date(), bugun = simdi.getFullYear() * 12 + simdi.getMonth() + simdi.getDate() / 31;
  const A = ay(Z.bas), B = ay(Z.son) + 1, K = ay(Z.sikistir), F = Z.sikistirOran;
  const oran = v => { v = Math.min(Math.max(v, A), B); return v < K ? (v - A) / (K - A) * F : F + (v - K) / (B - K) * (1 - F); };
  const yuzde = v => (oran(v) * 100).toFixed(2) + "%";
  const ayAdi = t => new Intl.DateTimeFormat(dil, { month: "short", year: "numeric" }).format(new Date(t + "-15"));
  const yap = (etiket, sinif, metin) => { const e = document.createElement(etiket); if (sinif) e.className = sinif; if (metin) e.textContent = metin; return e; };

  g.append(yap("div", "zc-eksen"));
  // Sıkıştırılmış dönem tek etiketle: "2018–23"
  const ilk = yap("div", "zc-yil ilk", String(A / 12) + "–" + String(Math.floor((K - 1) / 12)).slice(2)); ilk.style.setProperty("--a", "0%"); g.append(ilk);
  for (let y = Math.ceil(K / 12); y * 12 < B; y++) {
    const t = yap("div", "zc-yil" + (y === Math.ceil(K / 12) ? " ikinci" : ""), String(y)); t.style.setProperty("--a", yuzde(y * 12)); g.append(t);
  }
  Z.ogeler.forEach(o => {
    const bas = ay(o.bas), son = o.son ? ay(o.son) + 1 : bugun;
    const k = Math.min(Math.max((bugun - bas) / (son - bas), 0), 1) * 100;
    const c = yap("div", "zc-cizgi " + o.renk);
    c.style.setProperty("--a", yuzde(bas)); c.style.setProperty("--b", yuzde(son)); c.style.setProperty("--kat", o.kat); c.style.setProperty("--k", k.toFixed(1) + "%");
    const sure = ayAdi(o.bas) + " – " + (!o.son ? m("zcDevam") : ayAdi(o.son) + (son > bugun ? " (" + m("zcBeklenen") + ")" : ""));
    const a = yap("a", "zc-logo " + o.renk);
    a.href = linkedinBolumu(o.bolum, o.linkedin); a.target = "_blank"; a.rel = "noopener";
    a.title = o.kurum[dil] + " · " + sure; a.setAttribute("aria-label", a.title + " (LinkedIn)");
    a.style.setProperty("--a", yuzde(bas)); a.style.setProperty("--kat", o.kat);
    const l = yap("img", logoSinifi(o.logo)); l.src = o.logo; l.alt = ""; l.loading = "lazy"; a.append(l);
    g.append(c, a);
  });
  const b = yap("div", "zc-bugun"); b.style.setProperty("--a", yuzde(bugun)); g.append(b);
  const be = yap("div", "zc-bugun-etiket", m("zcBugun")); be.style.setProperty("--a", yuzde(bugun)); g.append(be);
}

/* ------------------------------------------------------------------
   Ülke fotoğrafları paneli
   Haritada (ya da ülke listesinde) fotoğrafı olan bir ülkeye tıklayınca açılır.
   Ülkenin birden fazla şehri varsa üstte şehir düğmeleri çıkar.
   ------------------------------------------------------------------ */
const ulkePanel = document.getElementById("ulkePanel");
let panelUlke = null, panelSehir = null;

function sehirAdi(s) { return typeof s === "string" ? s : (s ? s[dil] : ""); }
function ulkeFotolari(kod) { return FOTOGRAFLAR.filter(f => f.ulke === kod); }

function paneliYaz() {
  const hepsi = ulkeFotolari(panelUlke);
  const sehirler = [...new Set(hepsi.map(f => sehirAdi(f.sehir)).filter(Boolean))];
  // Şehri yazılmamış fotoğraflar, başka şehirler de varsa "Diğer" düğmesinde toplanır ("" = diğer)
  if (sehirler.length && hepsi.some(f => !sehirAdi(f.sehir))) sehirler.push("");
  const uyar = (f, sehir) => sehirAdi(f.sehir) === sehir || (sehir === "" && !sehirAdi(f.sehir));
  const liste = panelSehir === null ? hepsi : hepsi.filter(f => uyar(f, panelSehir));
  document.getElementById("panelBaslik").textContent = ulkeAdi(panelUlke);
  document.getElementById("panelAlt").textContent = hepsi.length + " " + m("fotoAdet") + (sehirler.length === 1 && sehirler[0] ? " · " + sehirler[0] : "");

  // Şehir düğmeleri (tek şehir varsa gösterilmez)
  const secici = document.getElementById("sehirSecici");
  secici.innerHTML = "";
  secici.setAttribute("aria-label", m("sehirSec"));
  secici.hidden = sehirler.length < 2;
  [null, ...sehirler].forEach(sehir => {
    const li = document.createElement("li");
    const dugme = document.createElement("button");
    dugme.type = "button";
    const adet = sehir === null ? hepsi.length : hepsi.filter(f => uyar(f, sehir)).length;
    dugme.textContent = (sehir === null ? m("tumu") : sehir || m("diger")) + " (" + adet + ")";
    dugme.setAttribute("aria-pressed", panelSehir === sehir);
    dugme.addEventListener("click", () => {
      panelSehir = sehir;
      paneliYaz();
      // Düğmeler yeniden çizildi; odak yeni seçili düğmede kalsın
      secici.querySelector('[aria-pressed="true"]').focus();
    });
    li.append(dugme); secici.append(li);
  });

  const izgara = document.getElementById("panelIzgara");
  izgara.innerHTML = "";
  liste.forEach((f, sira) => izgara.append(kucukFoto(f, liste, sira)));
}

function ulkePaneliAc(kod) {
  if (!ulkeFotolari(kod).length) return;
  panelUlke = kod; panelSehir = null;
  paneliYaz();
  ulkePanel.showModal();
  document.getElementById("panelIzgara").scrollTop = 0;
}

document.getElementById("panelKapat").addEventListener("click", () => ulkePanel.close());
ulkePanel.addEventListener("click", e => { if (e.target === ulkePanel) ulkePanel.close(); });   // panelin dışına tıklama

/* ------------------------------------------------------------------
   Fotoğraf büyütme kutusu
   Açma: fotoğrafa tıkla. Geçiş: oklar, klavyede sol/sağ ok, telefonda kaydır.
   Kapatma: × düğmesi, Esc ya da fotoğrafın dışına tıklama.
   ------------------------------------------------------------------ */
const buyutec = document.getElementById("buyutec");
const buyutecResim = document.getElementById("buyutecResim");
let fotoSira = 0;
let aktifListe = [];      // şu an gezilen fotoğraflar (şerit ya da seçili ülke/şehir)
let donusOdak = null;     // kutu kapanınca odağın döneceği küçük fotoğraf

function fotoGoster(sira) {
  const adet = aktifListe.length;
  fotoSira = (sira + adet) % adet;   // sondan başa, baştan sona döner
  const f = aktifListe[fotoSira];
  buyutecResim.src = f.dosya;
  buyutecResim.alt = f[dil] || "";
  document.getElementById("buyutecAlt").textContent = f[dil] || "";
  document.getElementById("buyutecSayac").textContent = (fotoSira + 1) + " / " + adet;
  document.getElementById("buyutecOnceki").hidden = adet < 2;
  document.getElementById("buyutecSonraki").hidden = adet < 2;
  // Bir sonraki ve önceki fotoğrafı önceden yükle ki geçiş beklemesin
  [1, -1].forEach(k => { new Image().src = aktifListe[(fotoSira + k + adet) % adet].dosya; });
}

function buyutecAc(liste, sira, kucuk) {
  aktifListe = liste;
  donusOdak = kucuk || null;
  fotoGoster(sira);
  buyutec.showModal();
}

buyutec.addEventListener("close", () => {
  // Kapanınca odak, fotoğrafın açıldığı küçük resme döner
  if (donusOdak && donusOdak.isConnected) donusOdak.focus();
});
document.getElementById("buyutecKapat").addEventListener("click", () => buyutec.close());
document.getElementById("buyutecOnceki").addEventListener("click", () => fotoGoster(fotoSira - 1));
document.getElementById("buyutecSonraki").addEventListener("click", () => fotoGoster(fotoSira + 1));
buyutec.addEventListener("click", e => {
  if (e.target === buyutec || e.target.id === "buyutecSahne") buyutec.close();   // fotoğrafın dışı
});
buyutec.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") fotoGoster(fotoSira - 1);
  if (e.key === "ArrowRight") fotoGoster(fotoSira + 1);
});
let kaydirmaBasi = null;
buyutec.addEventListener("touchstart", e => { kaydirmaBasi = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
buyutec.addEventListener("touchend", e => {
  if (kaydirmaBasi === null) return;
  const fark = e.changedTouches[0].clientX - kaydirmaBasi;
  if (Math.abs(fark) > 50) fotoGoster(fotoSira + (fark < 0 ? 1 : -1));
  kaydirmaBasi = null;
});

/* ==================================================================
   F) İLETİŞİM — LinkedIn ve gizlenmiş e-posta
   ================================================================== */
function iletisimiYaz() {
  const li = document.getElementById("linkedin");
  li.innerHTML = LINKEDIN_ADRESI
    ? '<a href="' + LINKEDIN_ADRESI + '" target="_blank" rel="noopener">LinkedIn</a>'
    : 'LinkedIn <span class="yakinda">' + m("yakinda") + '</span>';
  const adres = epostaAdresi();
  const a = document.createElement("button");
  a.type = "button"; a.className = "eposta-tetik"; a.textContent = adres;
  a.setAttribute("aria-haspopup", "dialog"); a.setAttribute("aria-expanded", "false"); a.setAttribute("aria-controls", "epostaMenu");
  a.addEventListener("click", () => epostaMenusuAc(a));
  document.getElementById("eposta").replaceChildren(a);
  const gl = document.getElementById("girisLinkedin");
  if (LINKEDIN_ADRESI) gl.href = LINKEDIN_ADRESI; else gl.hidden = true;
  document.getElementById("girisEposta").setAttribute("aria-label", m("eposta") + ": " + adres);
  // Menü açıksa dil değişince metinleri de yenile
  document.getElementById("epostaMenu").setAttribute("aria-label", m("epostaMenusu"));
  document.getElementById("epostaKopyala").textContent = m("kopyala");
  const gonder = document.getElementById("epostaGonder");
  gonder.textContent = m("epostaGonder"); gonder.href = "mailto:" + adres;
  document.getElementById("epostaAdres").textContent = adres;
}

function epostaAdresi() { return EPOSTA[0] + "@" + EPOSTA[1] + "." + EPOSTA[2]; }

/* ------------------------------------------------------------------
   E-posta menüsü: tıklayınca e-posta programı hemen açılmaz; önce adres
   gösterilir, "Kopyala" ya da "E-posta gönder" seçilir.
   ------------------------------------------------------------------ */
const epostaMenu = document.getElementById("epostaMenu");
let epostaTetik = null;

function epostaMenusuKapat(odakGeriDonsun) {
  if (epostaMenu.hidden) return;
  epostaMenu.hidden = true;
  if (epostaTetik) { epostaTetik.setAttribute("aria-expanded", "false"); if (odakGeriDonsun) epostaTetik.focus(); }
  epostaTetik = null;
}

function epostaMenusuAc(tetik) {
  if (!epostaMenu.hidden && epostaTetik === tetik) { epostaMenusuKapat(true); return; }
  epostaMenusuKapat(false);
  epostaTetik = tetik;
  document.getElementById("epostaKopyala").textContent = m("kopyala");
  epostaMenu.hidden = false;
  tetik.setAttribute("aria-expanded", "true");
  // Bağlantının hemen altına yerleştir, ekrandan taşmasın
  const r = tetik.getBoundingClientRect();
  const gen = epostaMenu.offsetWidth;
  const sol = Math.min(Math.max(window.scrollX + r.left, window.scrollX + 12), window.scrollX + document.documentElement.clientWidth - gen - 12);
  epostaMenu.style.left = sol + "px";
  epostaMenu.style.top = (window.scrollY + r.bottom + 8) + "px";
  document.getElementById("epostaKopyala").focus();
}

document.getElementById("girisEposta").addEventListener("click", e => epostaMenusuAc(e.currentTarget));
document.getElementById("epostaKopyala").addEventListener("click", async e => {
  const dugme = e.currentTarget;
  try { await navigator.clipboard.writeText(epostaAdresi()); }
  catch (hata) {
    // Panoya yazma izni yoksa adresi seçili bırak; kullanıcı Ctrl+C ile kopyalar
    const secim = window.getSelection(); const aralik = document.createRange();
    aralik.selectNodeContents(document.getElementById("epostaAdres")); secim.removeAllRanges(); secim.addRange(aralik);
    return;
  }
  dugme.textContent = m("kopyalandi");
  setTimeout(() => { if (!epostaMenu.hidden) dugme.textContent = m("kopyala"); }, 1800);
});
document.getElementById("epostaGonder").addEventListener("click", () => setTimeout(() => epostaMenusuKapat(false), 100));
document.addEventListener("click", e => {
  if (!epostaMenu.hidden && !epostaMenu.contains(e.target) && !e.target.closest(".eposta-tetik")) epostaMenusuKapat(false);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") epostaMenusuKapat(true); });
window.addEventListener("resize", () => epostaMenusuKapat(false));

/* ==================================================================
   G) HARİTA
   Veri: data/world-50m.json (orta detay) ve data/world-10m.json (yüksek
   detay). İkisi de Natural Earth'ten üretildi; her ülkenin çizimi hazır
   bir SVG yolu olarak durur (k: ülke kodu, d: yol, c: merkez, a: alan).
   ================================================================== */
const svg = document.getElementById("harita");
const kutu = document.getElementById("haritaKutu");
const ipucu = document.getElementById("ipucu");
const SVGNS = "http://www.w3.org/2000/svg";
const HARITA_G = 1000, HARITA_Y = 455;   // haritanın kendi ölçüsü
const EN_YAKIN = 16;                     // en fazla kaç kat yakınlaşılır
const BASLANGIC_MERKEZ = 625;            // dar ekranda ilk görünümün ortası (Avrupa–Afrika–Asya)

let gorunum = { x: 0, y: 0, g: HARITA_G };   // şu an görünen alan (sol, üst, genişlik)
let ilkGenislik = HARITA_G;
let yollar = {};            // ülke anahtarı -> <path>
let noktalar = [];          // küçük ülke noktaları
let yuklendi = false, detayIstendi = false;

function kutuOrani() { return kutu.clientHeight / kutu.clientWidth; }

// Görünümü sınırlar içinde tutar ve SVG'ye uygular
function gorunumuUygula() {
  if (!kutu.clientWidth || !kutu.clientHeight) return;
  gorunum.g = Math.min(Math.max(gorunum.g, HARITA_G / EN_YAKIN), HARITA_G);
  const yuk = gorunum.g * kutuOrani();
  gorunum.x = Math.min(Math.max(gorunum.x, 0), HARITA_G - gorunum.g);
  gorunum.y = yuk >= HARITA_Y ? (HARITA_Y - yuk) / 2 : Math.min(Math.max(gorunum.y, 0), HARITA_Y - yuk);
  svg.setAttribute("viewBox", gorunum.x + " " + gorunum.y + " " + gorunum.g + " " + yuk);
  // Noktalar ekranda hep aynı boyda kalsın
  const birim = gorunum.g / kutu.clientWidth;   // 1 ekran pikseli kaç harita birimi
  noktalar.forEach(n => {
    n.gorunen.setAttribute("r", 4.5 * birim);
    n.gorunen.setAttribute("stroke-width", 1.5);
    n.alan.setAttribute("r", 14 * birim);
  });
  svg.classList.toggle("suruklenebilir", gorunum.g < ilkGenislik - 1);
  // Yakınlaşınca yüksek detayı arka planda yükle
  if (yuklendi && !detayIstendi && gorunum.g < ilkGenislik / 1.5) { detayIstendi = true; veriYukle("data/world-10m.json"); }
}

function ilkGorunum() {
  // Dar (dikey) kutuda harita yüksekliği dolduracak kadar yakından başlar
  ilkGenislik = Math.min(HARITA_G, HARITA_Y / kutuOrani());
  const yuk = ilkGenislik * kutuOrani();
  gorunum = { g: ilkGenislik, x: ilkGenislik < HARITA_G ? BASLANGIC_MERKEZ - ilkGenislik / 2 : 0, y: (HARITA_Y - yuk) / 2 };
  gorunumuUygula();
}

// Ekrandaki bir noktayı harita koordinatına çevirir
function haritaNoktasi(ekranX, ekranY) {
  const r = svg.getBoundingClientRect();
  return { x: gorunum.x + (ekranX - r.left) / r.width * gorunum.g, y: gorunum.y + (ekranY - r.top) / r.width * gorunum.g };
}

// kat > 1 yakınlaştırır. (ekranX, ekranY) noktası yerinde kalır.
function yakinlastir(kat, ekranX, ekranY) {
  const r = svg.getBoundingClientRect();
  if (ekranX === undefined) { ekranX = r.left + r.width / 2; ekranY = r.top + r.height / 2; }
  const p = haritaNoktasi(ekranX, ekranY);
  const yeniG = Math.min(Math.max(gorunum.g / kat, HARITA_G / EN_YAKIN), HARITA_G);
  gorunum.x = p.x - (ekranX - r.left) / r.width * yeniG;
  gorunum.y = p.y - (ekranY - r.top) / r.width * yeniG;
  gorunum.g = yeniG;
  gorunumuUygula();
}

function durumSinifi(kod) { return kod === EV ? " ev" : ULKELER.includes(kod) ? " gidilen" : ""; }

// Veriyi indirir; ülkeleri çizer ya da (yüksek detayda) çizimleri yeniler
function veriYukle(dosya) {
  return fetch(dosya).then(c => { if (!c.ok) throw new Error(dosya); return c.json(); }).then(veri => {
    veri.ulkeler.forEach(u => {
      const anahtar = u.k || u.ad;
      let yol = yollar[anahtar];
      if (!yol) {
        yol = document.createElementNS(SVGNS, "path");
        yol.setAttribute("class", "ulke" + durumSinifi(u.k));
        if (ULKELER.includes(u.k)) yol.dataset.k = u.k;   // yalnızca gidilen ülkeler etkileşimli: üzerine gelince adı, tıklayınca fotoğrafları
        // gidilen ülkeler üstte dursun diye sona, diğerleri başa eklenir
        if (ULKELER.includes(u.k)) svg.append(yol); else svg.prepend(yol);
        yollar[anahtar] = yol;
        // Küçük ülkeler için nokta: biri görünen, biri dokunmayı kolaylaştıran geniş alan
        if (ULKELER.includes(u.k) && u.a < NOKTA_ESIGI) {
          const alan = document.createElementNS(SVGNS, "circle");
          const gorunen = document.createElementNS(SVGNS, "circle");
          [alan, gorunen].forEach(c => { c.setAttribute("cx", u.c[0]); c.setAttribute("cy", u.c[1]); c.dataset.k = u.k; c.dataset.nokta = "1"; });
          alan.setAttribute("class", "nokta-alan"); gorunen.setAttribute("class", "nokta");
          if (u.k === EV) gorunen.style.fill = "var(--ev)";
          noktalar.push({ alan, gorunen });
        }
      }
      yol.setAttribute("d", u.d);
    });
    noktalar.forEach(n => svg.append(n.alan, n.gorunen));   // noktalar en üstte
    svg.querySelectorAll("[data-k]").forEach(el => el.classList.toggle("fotolu", ulkeFotolari(el.dataset.k).length > 0));
    yuklendi = true;
    document.getElementById("haritaDurum").hidden = true;
    gorunumuUygula();
  });
}

// Harita, bölüme yaklaşılınca yüklenir (sayfa açılışını yavaşlatmasın diye)
new IntersectionObserver((girisler, gozcu) => {
  if (!girisler[0].isIntersecting) return;
  gozcu.disconnect();
  veriYukle("data/world-50m.json").catch(() => { document.getElementById("haritaDurum").textContent = m("haritaHata"); });
}, { rootMargin: "600px" }).observe(kutu);

// Kutunun boyutu değişince (ekran döndürme, pencere küçültme) görünümü yeniden ayarla
let ilkGorunumHazir = false;
new ResizeObserver(() => {
  if (!kutu.clientWidth || !kutu.clientHeight) return;
  if (!ilkGorunumHazir) { ilkGorunumHazir = true; ilkGorunum(); return; }
  ilkGenislik = Math.min(HARITA_G, HARITA_Y / kutuOrani());
  gorunumuUygula();
}).observe(kutu);

// --- Düğmeler ---
document.getElementById("yakinlas").addEventListener("click", () => yakinlastir(1.6));
document.getElementById("uzaklas").addEventListener("click", () => yakinlastir(1 / 1.6));
document.getElementById("sifirla").addEventListener("click", ilkGorunum);

// --- Masaüstü: Ctrl + tekerlek yakınlaştırır; normal tekerlek sayfayı kaydırır ---
svg.addEventListener("wheel", e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  yakinlastir(e.deltaY < 0 ? 1.25 : 1 / 1.25, e.clientX, e.clientY);
}, { passive: false });

// --- Masaüstü: yakınlaşmışken fareyle sürükleyerek kaydırma ---
let surukle = null;
svg.addEventListener("pointerdown", e => {
  if (e.pointerType !== "mouse" || e.button !== 0) return;
  surukle = { x: e.clientX, y: e.clientY, basladi: false };
});
window.addEventListener("pointermove", e => {
  if (!surukle) return;
  const dx = e.clientX - surukle.x, dy = e.clientY - surukle.y;
  if (!surukle.basladi && Math.hypot(dx, dy) < 4) return;   // küçük titremeleri sürükleme sayma
  surukle.basladi = true;
  svg.classList.add("surukleniyor");
  const birim = gorunum.g / svg.getBoundingClientRect().width;
  gorunum.x -= dx * birim; gorunum.y -= dy * birim;
  surukle.x = e.clientX; surukle.y = e.clientY;
  gorunumuUygula();
});
let sonSurukleme = 0;     // sürüklemenin sonundaki tıklama ülke paneli açmasın
window.addEventListener("pointerup", () => {
  if (surukle && surukle.basladi) sonSurukleme = Date.now();
  surukle = null; svg.classList.remove("surukleniyor");
});

// --- Mobil: iki parmakla yakınlaştırma ve kaydırma (tek parmak sayfayı kaydırır) ---
let cimdik = null;
function parmaklar(e) {
  const a = e.touches[0], b = e.touches[1];
  return { mesafe: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
}
svg.addEventListener("touchstart", e => { if (e.touches.length === 2) cimdik = parmaklar(e); }, { passive: true });
svg.addEventListener("touchmove", e => {
  if (e.touches.length !== 2 || !cimdik) return;
  e.preventDefault();
  const simdi = parmaklar(e);
  const birim = gorunum.g / svg.getBoundingClientRect().width;
  gorunum.x -= (simdi.x - cimdik.x) * birim; gorunum.y -= (simdi.y - cimdik.y) * birim;
  yakinlastir(simdi.mesafe / cimdik.mesafe, simdi.x, simdi.y);
  cimdik = simdi;
}, { passive: false });
svg.addEventListener("touchend", e => { if (e.touches.length < 2) cimdik = null; });

// --- Ülke adı: üzerine gelince ya da dokununca ---
let ipucuZamani;
function ipucuGoster(e) {
  const hedef = e.target.closest("[data-k]");
  if (!hedef || (surukle && surukle.basladi)) { ipucu.hidden = true; return; }
  const r = kutu.getBoundingClientRect();
  const adet = ulkeFotolari(hedef.dataset.k).length;
  ipucu.textContent = ulkeAdi(hedef.dataset.k) + (adet ? " · " + m("fotolarinaBak") : "");
  ipucu.hidden = false;
  const yarim = ipucu.offsetWidth / 2 + 4;
  ipucu.style.left = Math.min(Math.max(e.clientX - r.left, yarim), r.width - yarim) + "px";
  ipucu.style.top = Math.max(e.clientY - r.top, 44) + "px";
}
svg.addEventListener("pointermove", e => { if (e.pointerType === "mouse") ipucuGoster(e); });
svg.addEventListener("pointerleave", () => { ipucu.hidden = true; });
svg.addEventListener("click", e => {
  if (Date.now() - sonSurukleme < 300) return;
  const hedef = e.target.closest("[data-k]");
  if (hedef && ulkeFotolari(hedef.dataset.k).length) { ipucu.hidden = true; ulkePaneliAc(hedef.dataset.k); return; }
  ipucuGoster(e);
  clearTimeout(ipucuZamani);
  ipucuZamani = setTimeout(() => { ipucu.hidden = true; }, 2500);
});

/* ------------------------------------------------------------------
   ReviewRadar demo videosu
   ------------------------------------------------------------------ */
const rrDemo = document.getElementById("rrDemo");
if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  rrDemo.controls = true;   // kendiliğinden oynamaz; isteyen oynatır
} else {
  new IntersectionObserver(girisler => {
    girisler.forEach(g => { if (g.isIntersecting) rrDemo.play().catch(() => {}); else rrDemo.pause(); });
  }, { threshold: 0.4 }).observe(rrDemo);
}

/* ==================================================================
   H) SAYFALAR
   Ana sayfada tüm bölümler alt alta durur. Üst menüden bir bölüm
   seçilince (adres #projeler gibi olur) yalnızca o bölüm gösterilir.
   Üstteki ada tıklamak ana sayfaya döndürür; tarayıcının geri tuşu da çalışır.
   ================================================================== */
const SAYFALAR = ["hakkimda", "projeler", "geziler", "iletisim"];

function sayfayiGoster() {
  const secili = location.hash.slice(1);
  const sayfa = SAYFALAR.includes(secili) ? secili : "";   // boşsa ana sayfa
  document.querySelectorAll("main > section").forEach(b => { b.hidden = sayfa !== "" && b.id !== sayfa; });
  document.body.classList.toggle("tek-sayfa", sayfa !== "");
  document.querySelectorAll(".menu a").forEach(a => {
    if (a.getAttribute("href") === "#" + sayfa) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  window.scrollTo({ top: 0, behavior: "instant" });
}
window.addEventListener("hashchange", sayfayiGoster);

/* ==================================================================
   I) BAŞLAT
   ================================================================== */
metinleriYaz();
sayfayiGoster();
</script>
